const LAB_CALISTHENICS_DAY='Lab Calisthenics';
const LAB_CALISTHENICS_PLAN=(function(){const ex=[];Object.keys(CALISTHENICS_LIBRARY).forEach(function(g){Object.keys(CALISTHENICS_LIBRARY[g]).forEach(function(c){CALISTHENICS_LIBRARY[g][c].forEach(function(e){ex.push(e);});});});return {t:'Calisthenics Lab',em:'🤸',ex:ex};})();
function isLabDay(day){return day===LAB_CALISTHENICS_DAY;}

/* ===== Lab: one ladder per skill, and where she stands on it =====
   CALISTHENICS_LIBRARY is skill -> level -> [[name, prescription, sets, type, id], ...].
   Flattened in declaration order it is a progression: the ladder for that skill.
   Her current rung is stored per skill, device-local, and never inferred from history —
   moving up is an explicit choice, like every other decision in this app. */
const LAB_SKILLS=Object.keys(CALISTHENICS_LIBRARY);
const LAB_LADDER=(function(){
  const out={};
  LAB_SKILLS.forEach(function(skill){
    const rungs=[];
    Object.keys(CALISTHENICS_LIBRARY[skill]).forEach(function(level){
      CALISTHENICS_LIBRARY[skill][level].forEach(function(e){rungs.push({ex:e,level:level,id:e[4],name:e[0],pres:e[1]});});
    });
    out[skill]=rungs;
  });
  return out;
})();
function labStepKey(skill){return 'fede:lab:step:'+skill;}
// null until she has chosen a rung. Nothing is guessed: until then the plan's own
// prescription stands, so a fresh device never quietly demotes her to rung one.
function labStepRaw(skill){
  const n=LAB_LADDER[skill]?LAB_LADDER[skill].length:0;
  if(!n)return null;
  let raw=null; try{raw=localStorage.getItem(labStepKey(skill));}catch(e){raw=null;}
  if(raw===null||raw==='')return null;
  const v=parseInt(raw,10);
  if(!(v>=0))return 0;
  return Math.min(v,n-1);
}
function labStep(skill){const v=labStepRaw(skill);return v===null?0:v;}
function labHasStep(skill){return labStepRaw(skill)!==null;}
function labSetStep(skill,i){
  const n=LAB_LADDER[skill]?LAB_LADDER[skill].length:0;
  if(!n)return 0;
  const v=Math.max(0,Math.min(parseInt(i,10)||0,n-1));
  try{localStorage.setItem(labStepKey(skill),String(v));}catch(e){}
  return v;
}
// Where she is and what comes next, for one skill.
function labCurrent(skill){
  const rungs=LAB_LADDER[skill]||[]; if(!rungs.length)return null;
  const i=labStep(skill);
  return {skill:skill,index:i,total:rungs.length,level:rungs[i].level,chosen:labHasStep(skill),
          current:rungs[i],next:(i+1<rungs.length)?rungs[i+1]:null};
}
// Today's Lab session: the current rung of every skill. Four skills, four items.
function labSessionToday(){return LAB_SKILLS.map(labCurrent).filter(Boolean);}

/* ===== The skill is the first exercise of the day, at her rung =====
   Not a separate section: she never opened the Lab, but when a skill leads a gym
   day she does it two times out of three. So the plan keeps its slot and the
   ladder decides which rung fills it. The id stays the day's own, so her history
   for that slot is continuous even when the rung changes. */
const SKILL_FOR_DAY={'Giorno 3':'Frog Stand','Giorno 4':'L-Sit'};
function skillOfDay(day){return SKILL_FOR_DAY[String(day)]||null;}
// The plan entry for today's rung of that skill, shaped like any other exercise.
function skillEntryForDay(day){
  const skill=skillOfDay(day); if(!skill)return null;
  if(!labHasStep(skill))return null;            // she has not placed herself yet
  const cur=labCurrent(skill); if(!cur)return null;
  const r=cur.current;
  return [r.name,r.pres,3,'skill',String(day).toLowerCase().replace(/\s+/g,'-')+'__skill'];
}
// Swap the plan's leading skill for the rung she is on. Pure: returns a copy.
function withSkillRung(day,dp){
  const e=skillEntryForDay(day);
  if(!e||!dp||!Array.isArray(dp.ex)||!dp.ex.length)return dp;
  if(String(dp.ex[0][3])!=='skill')return dp;      // only ever the leading skill slot
  const out={};Object.keys(dp).forEach(function(k){out[k]=dp[k];});
  out.ex=dp.ex.slice(); out.ex[0]=e;
  return out;
}

/* ===== Lab attendance: done, or skipped, never nagged ===== */
function labMarkKey(date){return 'fede:lab:mark:'+date;}
function labMark(date){try{return localStorage.getItem(labMarkKey(date))||'';}catch(e){return '';}}
function labSetMark(date,what){
  // 'done' | 'skipped' | '' (cleared). Recorded so the weekly summary can be honest;
  // nothing in the app warns about it.
  try{ if(what)localStorage.setItem(labMarkKey(date),what); else localStorage.removeItem(labMarkKey(date)); }catch(e){}
}
// The Lab is offered on the days the gym plan pairs it with, at the top, already open.
const LAB_OFFERED_ON=['Giorno 3','Giorno 4'];
function labOfferedOn(day){return LAB_OFFERED_ON.indexOf(String(day))>=0;}
function labWeekSummary(dates){
  // dates: the dates of the week, newest or oldest first, it does not matter.
  let done=0,skipped=0,offered=0;
  (dates||[]).forEach(function(d){
    const m=labMark(d);
    if(m==='done'){done++;offered++;}
    else if(m==='skipped'){skipped++;offered++;}
  });
  return {done:done,skipped:skipped,offered:offered};
}

function slugExercise(s){
  return String(s||'').toLowerCase().replace(/·/g,' ').replace(/\//g,'-').replace(/[^a-z0-9àèéìòù]+/g,'-').replace(/^-+|-+$/g,'');
}
function musclesForExercise(name){
  if(MUSCLE_DB[name]) return MUSCLE_DB[name];
  const n=String(name||'').toLowerCase();
  if(/glute|hip thrust|abduction|clamshell|kickback/.test(n)) return ["Glutei"];
  if(/curl|biceps/.test(n)) return ["Bicipiti"];
  if(/triceps|dip/.test(n)) return ["Tricipiti"];
  if(/row|pulldown|pull-up/.test(n)) return ["Gran dorsale","Romboidi"];
  if(/chest|press/.test(n)) return ["Pettorali","Deltoidi","Tricipiti"];
  if(/lateral|shoulder|pec deck/.test(n)) return ["Deltoidi"];
  if(/leg press|split squat|quad/.test(n)) return ["Quadricipiti","Glutei"];
  if(/leg curl|rdl|stacco|extension/.test(n)) return ["Femorali","Glutei"];
  if(/calf/.test(n)) return ["Polpacci"];
  if(/l-sit|frog|dead bug|knee raise|vacuum|crunch/.test(n)) return ["Core"];
  return ["Muscoli coinvolti nel movimento"];
}

function canonicalWorkoutDay(day){
  const m=String(day||'').match(/^Day\s*([1-5])$/i);

}
// READ-ONLY day label resolution for comparisons/lookups. Unlike canonicalWorkoutDay() (whose
// result may be persisted), it also maps the English-mode "Swimming" label back to "Nuoto".
function readWorkoutDay(day){const c=canonicalWorkoutDay(day);return /^swimming$/i.test(String(c||''))?'Nuoto':c;}
// Read-only equivalence of day labels ("Day 1" written by old English-mode exports === "Giorno 1").
function sameWorkoutDay(a,b){return readWorkoutDay(a)===readWorkoutDay(b);}
// The other spelling(s) of a day label, used only to READ legacy positional/name keys.
function altWorkoutDayLabels(day){
  const c=readWorkoutDay(day), m=String(c).match(/^Giorno ([1-5])$/), out=[];
  if(m){if(day!==c)out.push(c);if(day!=='Day '+m[1])out.push('Day '+m[1]);}
  else if(c==='Nuoto'){if(day!=='Nuoto')out.push('Nuoto');if(day!=='Swimming')out.push('Swimming');}

}

// Older bundled/user backups stored the active plan under Day 1…Day 5.
// The current app uses Giorno 1…Giorno 5. Rename only the plan keys, preserving
// the complete exercise payload, so legacy history and personalised plans remain intact.
function canonicalPlanKeys(plan){
  if(!plan||typeof plan!=='object')return plan;
  const out={}, keys=Object.keys(plan);
  // Single pass, original key order preserved. A legacy "Day N" is renamed to "Giorno N" only
  // when the plan has no "Giorno N" of its own (and no earlier "Day N" claimed it); otherwise it
  // is kept under its ORIGINAL key (never dropped), so no plan day is lost when persisted.
  keys.forEach(function(day){
    const canonical=canonicalWorkoutDay(day);
    if(canonical===day||Object.prototype.hasOwnProperty.call(plan,canonical)||Object.prototype.hasOwnProperty.call(out,canonical))out[day]=plan[day];
    else out[canonical]=plan[day];
  });

}

function slugify(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
// Compatibility layer: reduces any exercise ID ever written by this app to its permanent form.
// Legacy IDs embedded the description ("giorno-1__pull-up__4-x-4-6-rir-1-2-180-sec") -> "giorno-1__pull-up".
// Kept: "__activation" (a distinct exercise) and numeric duplicate suffixes ("__2").
function canonicalExerciseId(id){
  const raw=String(id==null?'':id), parts=raw.split('__');
  if(parts.length<2)return raw;
  const keep=parts.slice(2).filter(function(t){return t==='activation'||/^\d+$/.test(t);});
  return [parts[0],parts[1]].concat(keep).join('__');
}
function exerciseId(day,index,e){
  if(e&&e[4]) return e[4];
  // Fallback for exercises without a permanent ID: canonical day + exercise name only.
  // The description (sets/reps/RIR/rest) is never part of the ID. Duplicate names within
  // a day are made unique by preparePlanExerciseIds().
  const name=slugify(e&&e[0]);
  let base=slugify(canonicalWorkoutDay(day))+'__'+name;
  // Semantic IDs keep duplicate exercises distinct (e.g. activation vs working abduction)
  if(name==='hip-abduction-seated'){
    if(/pre-attivazione|activation/.test(slugify(e&&e[1]))) base+='__activation';
    else base+='__working';

// in plan order, a new ID that collides (canonically) with one already in the same day
// gets "__2", "__3", ... (canonicalExerciseId() keeps numeric suffixes).

      if(!Array.isArray(e)||e[4])return;

    const np=newPlan[day], op=oldPlan[day];

// - an unknown/missing requested variant keeps the current one. Exercise arrays (IDs, custom fields)
//   are deep-copied as-is.
function setupDay5Variants(plan,variant){
  if(!plan||!plan['Giorno 5'])return plan;
  const p=plan['Giorno 5'];
  if(!p.variants||typeof p.variants!=='object')return plan;
  const current=(p.variant==='B')?'B':'A';
  const v=(variant==='A'||variant==='B')?variant:current;
  if(v===current&&p.variant===current)return plan;
  if(Array.isArray(p.ex))p.variants[current]=JSON.parse(JSON.stringify(p.ex));

/* ================= COACH A REGOLE =================
   Aritmetica sui suoi dati, dentro il telefono. Nessuna chiamata, nessun
   modello, nessun costo. Ogni avviso porta con se' da dove viene, cosi' lei
   puo' dirmi quando sbaglia. Non modifica mai niente: propone. */
const COACH_MIN_SESSIONS=8;
const COACH_SEEN_KEY='fede:coachseen';

// Una seduta conta solo se e' pulita. Tre filtri, tutti nati dai suoi dati.
function coachValidSessions(records){
  const out=[];
  (records||[]).forEach(function(r){
    if(!r||!r._date)return;
    const d=norm(r);
    const giorni={};
    Object.keys(d.sets||{}).forEach(function(id){giorni[String(id).split('|')[0]]=1;});
    // sedute doppie: esercizi di piu' giornate nello stesso record
    if(Object.keys(giorni).length>1)return;
    var serie=0, impossibili=0;
    Object.keys(d.sets||{}).forEach(function(id){
      const x=d.sets[id]; if(!x)return;
      const reps=+x.r||0, kg=+x.kg||0, sec=+x.sec||0;
      if(reps>50||kg>200){impossibili++;return;}      // valori impossibili
      if(reps||sec)serie++;
    });
    if(!serie)return;                                  // giornate vuote
    out.push({date:dateFromKey(r._date),key:r._date,day:r.day||'',sets:d.sets||{},serie:serie,scartate:impossibili});
  });
  out.sort(function(a,b){return a.date-b.date;});
  return out;
}
function coachReady(){return coachValidSessions(recentRecords(120)).length>=COACH_MIN_SESSIONS;}

// Serie registrate di un esercizio, seduta per seduta, dalla piu' recente.
function coachExerciseRuns(sess,exId){
  const out=[];
  sess.slice().reverse().forEach(function(s){
    const righe=[];
    Object.keys(s.sets).forEach(function(id){
      const p=String(id).split('|');
      if(p[1]!==exId)return;
      const x=s.sets[id]; const kg=+x.kg||0, r=+x.r||0;
      if(r)righe.push({kg:kg,r:r});
    });
    if(righe.length)out.push({date:s.date,righe:righe,
      topKg:Math.max.apply(null,righe.map(function(x){return x.kg;})),
      reps:righe.map(function(x){return x.r;}).join('-')});
  });
  return out;
}
// Macchine pesanti: il salto utile e' 5 kg, non 2,5.
function coachLoadStep(exName,kg){return (kg>=60||/hip abduction|hip adduction|leg press|hip thrust|back extension/i.test(exName))?5:2.5;}

// Il suggerimento di carico vive dentro l'esercizio, non negli avvisi: serve
// mentre sei li', con le serie appena chiuse.
function coachLoadHint(day,i,e){
  if(!e)return '';
  if(isTimedExercise(e)||exLoad(e)==='bodyweight')return '';
  const d=exDone(data,day,i); if(!d.tot||d.n<d.tot)return '';   // solo a serie tutte chiuse
  const sess=coachValidSessions(recentRecords(120));
  if(sess.length<COACH_MIN_SESSIONS)return '';
  const runs=coachExerciseRuns(sess,e[4]||exerciseId(day,i,e));
  if(runs.length<3)return '';
  const tre=runs.slice(0,3);
  if(!tre.every(function(x){return x.topKg===tre[0].topKg;})||!tre[0].topKg)return '';
  const passo=coachLoadStep(exName(e),tre[0].topKg);
  return '<div class="coach-hint"><b>'+tr('Suggerimento','Suggestion')+'</b>'+tr('Tre sedute chiuse a ','Three sessions closed at ')+tre[0].topKg
    +tr(' kg. La prossima prova <b>',' kg. Next time try <b>')+(getAppLanguage()==='en'?String(tre[0].topKg+passo):String(tre[0].topKg+passo).replace('.',','))+' kg</b>.'
    +'<em>'+tre.map(function(x){return x.date.toLocaleDateString(APP_LOCALE(),{day:'numeric',month:'short'});}).reverse().join(' \u00b7 ')+'</em></div>';
}

function coachNotices(){
  const sess=coachValidSessions(recentRecords(120));
  if(sess.length<COACH_MIN_SESSIONS)
    return {ready:false,mancano:COACH_MIN_SESSIONS-sess.length,valide:sess.length,items:[]};
  const items=[], stalli=[], saltati=[];
  // 1) stallo: stesso carico E stesse ripetizioni per tre sedute
  const visti={};
  sess.slice().reverse().forEach(function(s){Object.keys(s.sets).forEach(function(id){
    const p=String(id).split('|'); if(p.length<3)return; visti[p[1]]=1;});});
  Object.keys(visti).forEach(function(exId){
    const runs=coachExerciseRuns(sess,exId);
    if(runs.length<3)return;
    const tre=runs.slice(0,3);
    const nome=exNameFromId(exId)||exId;
    // Un esercizio a tempo non va in stallo di carico: il tapis non ha un peso.
    if(isTimedExercise([nome,''])||exLoad([nome,''])==='bodyweight')return;
    if(tre.every(function(x){return x.topKg===tre[0].topKg&&x.reps===tre[0].reps;})&&tre[0].topKg>0){
      stalli.push({id:'stallo:'+exId,kind:'stallo',peso:tre[0].topKg,
        text:nome+': '+tre[0].topKg+' kg \u00d7 '+tre[0].reps+tr(' per tre sedute.',' for three sessions.'),
        why:tr('Il ','On ')+tre.map(function(x){return x.date.toLocaleDateString(APP_LOCALE(),{day:'numeric',month:'short'});}).reverse().join(tr(', il ',', on '))+'.',
        urgenza:2});
    }
  });
  // Al massimo tre stalli, i piu' pesanti: sette avvisi uguali sono rumore.
  stalli.sort(function(a,b){return b.peso-a.peso;}).slice(0,3).forEach(function(x){items.push(x);});
  // 2) giorni saltati rispetto al calendario
  const prev={}; try{Object.keys(goals.sched||{}).forEach(function(w){const g=goals.sched[w];
    if(g&&g!=='Riposo')prev[g]=(prev[g]||0)+1;});}catch(e){}
  const due=new Date(cur); due.setDate(due.getDate()-14);
  const fatti={}; sess.filter(function(s){return s.date>=due;}).forEach(function(s){fatti[s.day]=(fatti[s.day]||0)+1;});
  Object.keys(prev).forEach(function(g){
    const attesi=prev[g]*2, veri=fatti[g]||0;
    if(attesi>=2&&veri<=attesi-2)saltati.push({g:g,veri:veri,attesi:attesi});
  });
  // Piu' di due giornate saltate diventano un avviso solo: l'elenco non aiuta.
  if(saltati.length>2){
    items.push({id:'saltato:molti',kind:'saltato',
      text:saltati.map(function(x){return x.g;}).join(', ')+tr(': nessuna o quasi nelle ultime due settimane.',': none or almost none in the last two weeks.'),
      why:tr('Sono ','That is ')+saltati.length+tr(' giornate su ',' days out of ')+Object.keys(prev).length+tr(' previste dal calendario.',' the calendar plans.'),urgenza:1});
  }else saltati.forEach(function(x){
    items.push({id:'saltato:'+x.g,kind:'saltato',
      text:x.g+': '+x.veri+tr(' sedute su ',' sessions out of ')+x.attesi+tr(' nelle ultime due settimane.',' in the last two weeks.'),
      why:tr('Il calendario lo mette ','The calendar sets it ')+prev[x.g]+(prev[x.g]===1?tr(' volta',' time'):tr(' volte',' times'))+tr(' a settimana.',' a week.'),urgenza:1});
  });
  // 3) asimmetria, dalla funzione che gia' esiste
  (asymmetryReport(recentRecords(20))||[]).forEach(function(a){
    items.push({id:'asim:'+a.id,kind:'asimmetria',
      text:(exNameFromId(a.id)||a.id)+': '+a.pct+tr('% pi\u00f9 forte a ','% stronger on the ')+(a.stronger==='right'?tr('destra','right'):tr('sinistra','left'))+'.',
      why:tr('Su ','Across ')+a.sessions+tr(' sedute con entrambi i lati registrati.',' sessions with both sides logged.'),urgenza:3});
  });
  // 4) gradino successivo delle skill
  (typeof labSessionToday==='function'?labSessionToday():[]).forEach(function(sk){
    if(!sk||!sk.next||!sk.current)return;
    const runs=coachExerciseRuns(sess,'lab-calisthenics__'+String(sk.current[0]||'').toLowerCase().replace(/[^a-z0-9]+/g,'-'));
    if(runs.length>=2)items.push({id:'skill:'+sk.skill,kind:'skill',
      text:sk.skill+tr(': il gradino dopo \u00e8 ',': the next rung is ')+sk.next[0]+'.',
      why:tr('Hai registrato il gradino attuale in ','You have logged the current rung in ')+runs.length+tr(' sedute. Sali solo se te la senti.',' sessions. Move up only if you feel ready.'),urgenza:4});
  });
  items.sort(function(a,b){return a.urgenza-b.urgenza;});
  // Tetto complessivo: oltre cinque avvisi smette di essere un consiglio.
  return {ready:true,valide:sess.length,items:items.slice(0,5),totale:items.length};
}
function exNameFromId(id){
  const s=String(id||'');

// No bundled seed: a fresh installation starts empty and can never receive personal data from a

async function load(){

  flushSave();

  // regala: lo e' solo se il profilo e' davvero compilato.
  if(!profile.setupComplete && existingUserDetected()){profile=Object.assign(profile,{name:"Fede",personalised:false});profile.setupComplete=profileComplete(profile);saveProfile();}

  if(!userPlan){const sv=localStorage.getItem('fede:day5Variant');if(sv==='A'||sv==='B')setupDay5Variants(PLAN,sv);}

  // Normalize only the session label; set/history payloads remain untouched.
  data.day=canonicalWorkoutDay(data.day);
  // Hard-coded SEEDS (two historical sessions): only on a device that already has workout history
  // (never on a fresh install), only for a record without sets, and never overwriting a note.
  const sd=existingUserDetected()?SEEDS.filter(function(x){return x.date===k(cur);})[0]:null;
  if(sd&&Object.keys(data.sets).length===0){data.day=sd.day;data.note=data.note||sd.note;data.sets=JSON.parse(JSON.stringify(sd.sets));if(sd.day==="Giorno 3")data.dayEx=["Machine Hip Thrust","Leg Press piedi alti","B-Stance RDL","Leg Extension","Back Extension Glute Bias","Hip Abduction Seated"];else if(planForUser()[sd.day])data.dayEx=planForUser()[sd.day].ex.map(function(e){return e[0];});}
  try{const gg=localStorage.getItem("fede:goals");if(gg){const pg=JSON.parse(gg);
    goals=Object.assign(goals,pg);
    // Weekly schedule: the user's choices are NEVER reset (not even when the plan/schedule version
    // changes). Only legacy "Day N" labels are canonicalised and missing weekdays are filled with
    // defaults. Unknown fields in fede:goals are preserved. Written only if something changed,
    // after a verified safety snapshot (idempotent: the next load finds nothing to change).
    goals.sched=Object.assign({1:"Giorno 1",2:"Giorno 2",3:"Giorno 3",4:"Riposo",5:"Giorno 4",6:"Giorno 5",0:"Riposo"},canonicalSchedule(pg.sched||{}));
    const next=JSON.stringify(goals);
    if(next!==gg&&createSafetySnapshot('schedule-reconcile'))localStorage.setItem("fede:goals",next);
  }}catch(e){}
  goals.sched=canonicalSchedule(goals.sched);
  // scheduleVersion is now only an informational marker; it never triggers a reset.
  if(localStorage.getItem("fede:scheduleVersion")!==String(WORKOUT_PLAN_VERSION)){try{localStorage.setItem("fede:scheduleVersion",String(WORKOUT_PLAN_VERSION));}catch(e){}}
  const stored=await get(cur);
  if(!stored&&!sd){const pick=goals.sched[cur.getDay()];if(pick&&(planForUser()[pick]||PLAN[pick]))data.day=pick;}
  await loadWeek();
  await loadAgenda();
  render();
}

// READ-ONLY history of a Calisthenics Lab exercise (by permanent ID) from the Lab namespace of each record.

async function labStrengthHist(id){
  const idx=LAB_CALISTHENICS_PLAN.ex.findIndex(function(e){return e[4]===id;}), e=LAB_CALISTHENICS_PLAN.ex[idx];
  if(!e)return [];
  const todayStr=k(cur), timed=isTimedExercise(e), uni=isUnilateralExercise(e), raw=[];
  let dates=await listSavedDates(); dates=(dates||[]).filter(function(ds){return ds<=todayStr;}).sort();
  for(let i=0;i<dates.length;i++){
    const ds=dates[i], d=new Date(ds+'T12:00:00'), v=(ds===todayStr)?data:await get(d);
    if(!v)continue;
    let maxKg=0,maxCnt=0;
    for(let s=1;s<=(+e[2]||3);s++){
      const recs=[getSetValue(v,LAB_CALISTHENICS_DAY,idx,e,s)];
      if(uni)recs.push(getSideSetValue(v,LAB_CALISTHENICS_DAY,idx,e,s,'right'),getSideSetValue(v,LAB_CALISTHENICS_DAY,idx,e,s,'left'));
      recs.forEach(function(rec){if(!rec)return;const kg=parseFloat(rec.kg)||0,c=parseFloat(timed?rec.sec:rec.r)||0;if(kg>maxKg)maxKg=kg;if(c>maxCnt)maxCnt=c;});
    }
    if(maxKg>0||maxCnt>0)raw.push({d:d,kg:maxKg,cnt:maxCnt});
  }
  const useKg=raw.some(function(x){return x.kg>0;});
  return raw.map(function(x){return useKg?{d:x.d,kg:x.kg,r:x.cnt,unit:'kg',lab:true}:{d:x.d,kg:x.cnt,r:x.cnt,unit:timed?'sec':'reps',lab:true};});
}

// Keeps a record's exercise map (dayEx names + dayExIds, index-aligned) in step with the plan WITHOUT
// rewriting history: a record with no map gets the current list; a record with a map only gains
// exercises it lacks, appended at the end (existing positions, used by legacy positional keys,
// never change); a legacy record with names but no IDs is left untouched.
function syncRecordExerciseMap(rec,day){
  const p=dayPlan(day);
  if(!rec||!p||!Array.isArray(p.ex))return;
  const names=p.ex.map(function(e){return e[0];}), ids=p.ex.map(function(e,i){return exerciseId(day,i,e);});
  const hasNames=Array.isArray(rec.dayEx)&&rec.dayEx.length, hasIds=Array.isArray(rec.dayExIds)&&rec.dayExIds.length;
  if(!hasNames&&!hasIds){rec.dayEx=names;rec.dayExIds=ids;return;}
  if(!hasIds||!hasNames||rec.dayEx.length!==rec.dayExIds.length)return;
  const known={}; rec.dayExIds.forEach(function(id){known[canonicalExerciseId(id)]=1;});
  ids.forEach(function(id,i){if(!known[canonicalExerciseId(id)]){rec.dayExIds.push(id);rec.dayEx.push(names[i]);known[canonicalExerciseId(id)]=1;}});
}
// saveDirty: there are in-memory changes to `data`/`goals` not yet written to localStorage.
let saveDirty=false;
function save(){saveDirty=true;clearTimeout(saveT);saveT=setTimeout(doSave,400);}
function saveGoals(){goalsDirty=true;save();}
// Writes pending changes IMMEDIATELY (synchronously) and cancels the debounce timer, so the same
// change is never written twice. Used before switching date (load), on pagehide / page hidden /
// beforeunload, and before a Service Worker update reload. Returns true if nothing is left unsaved.
function flushSave(){
  if(saveT){clearTimeout(saveT);saveT=null;}
  if(!saveDirty)return true;
  return doSaveNow();
}
async function doSave(){return doSaveNow();}
function doSaveNow(){
  if(!data||!key){saveDirty=false;return true;}
  if(saving){pending=true;return false;}
  saving=true;
  const s=document.getElementById('status');
  try{
    syncRecordExerciseMap(data,data.day);
    data._updatedAt=new Date().toISOString();
    localStorage.setItem(key,JSON.stringify(data));
    if(goalsDirty){localStorage.setItem("fede:goals",JSON.stringify(goals));goalsDirty=false;}
    saveDirty=false;
    if(s){s.style.color="var(--ok)";s.textContent="✓ salvato";setTimeout(function(){if(s&&s.textContent==="✓ salvato")s.textContent="";},1500);}
    return true;
  }catch(e){
    const msg=(e&&e.message)||"errore salvataggio";
    if(s){s.style.color="#c9557f";
      s.textContent=/rate limit/i.test(msg)?"⏳ troppi salvataggi, riprovo tra poco…":"⚠ "+msg;}
    // ritenta una volta sola dopo una pausa
    clearTimeout(saveT);saveT=setTimeout(doSave,6000);
    return false;
  }finally{
    saving=false;
    if(pending){pending=false;clearTimeout(saveT);saveT=setTimeout(doSave,1500);}
  }
}
async function loadLastSession(day,exIdx,exName){
  lastExLoading=true;
  try{
    const lab=isLabDay(day);
    const e=dayPlan(day).ex[exIdx];
    if(!e){lastEx=null;lastExDate=null;return;}
    const todayStr=k(cur);
    let dates=await listSavedDates();
    if(dates===null){
      // list() non disponibile: fallback a scansione classica limitata
      dates=[];
      for(let i=1;i<=30;i++){
        const d=new Date(cur); d.setDate(d.getDate()-i); d.setHours(12,0,0,0);
        dates.push(k(d));
      }
    }else{
      dates=dates.filter(function(ds){return ds<todayStr;});
    }
    for(let i=0;i<dates.length && i<60;i++){
      const d=new Date(dates[i]+'T12:00:00');
      let v=null;
      try{v=await get(d);}catch(err){v=null;}
      if(!v||!v.day)continue;
      // cerca per NOME esercizio usando l'istantanea salvata in quella sessione (dayEx):
      // è l'unico modo affidabile di sapere cosa c'era in ogni posizione quando fu salvata.
      // Se la sessione è troppo vecchia e non ha dayEx, si prova con la struttura attuale
      // come ultima spiaggia (funziona solo se la scheda non è stata riordinata nel frattempo).
      // Lab: same permanent ID in the Lab namespace of each record (never the main-day exercise of that name).
      const srcIdxs=lab?[exIdx]:findHistoricalIndices(v,day,exIdx,e[0]);
      if(!srcIdxs.length)continue;
      const found={};
      let any=false;
      const nSets=e[2];
      const unilateral=isUnilateralExercise(e);
      for(let s=1;s<=nSets;s++){
        for(let ii=0;ii<srcIdxs.length;ii++){
          const srcIdx=srcIdxs[ii];
          const oldPlan=(planForUser()[v.day]&&planForUser()[v.day].ex)||[];
          const oldEx=lab?e:historicalExercise(v,srcIdx,e,day), rday=lab?day:v.day;
          if(unilateral){
            let sideFound=false;
            ['right','left'].forEach(function(side){const rec=getSideSetValue(v,rday,srcIdx,oldEx,s,side);if(rec&&(rec.r||rec.sec)){found[s+'-'+side]=rec;any=true;sideFound=true;}});
            // Same exercise logged before right/left tracking existed: show it as a bilateral set.
            if(!sideFound&&!found[s]){const rec=getSetValue(v,rday,srcIdx,oldEx,s);if(rec&&(rec.r||rec.sec)){found[s]=rec;any=true;}}
          }else{
            const rec=getSetValue(v,rday,srcIdx,oldEx,s);
            if(rec&&(rec.r||rec.sec)){found[s]=rec;any=true;break;}
          }
        }
      }
      if(any){lastEx=found;lastExDate=d;return;}
    }
    lastEx=null;lastExDate=null;
  }catch(err){
    lastEx=null;lastExDate=null;
  }finally{
    lastExLoading=false;
  }
}

// Read-only: for a bilateral set input of the exercise currently open, returns the value
// shown on screen when it comes from a legacy key (old description-based ID, positional or
// name key). For right/left inputs, only a legacy key of the SAME side is used (never a bilateral
// entry: its side is unknown). Returns null for any key not of the open exercise.
function displayedLegacySet(id){
  const parts=String(id).split('|');
  if((parts.length!==3&&parts.length!==4)||!data)return null;
  const p=dayPlan(data.day), e=p&&p.ex&&p.ex[exIdx], s=+parts[2];
  if(!e||!(s>0))return null;
  if(parts.length===4){
    const side=parts[3];
    if((side!=='right'&&side!=='left')||sideSetKey(data.day,exIdx,e,s,side)!==id)return null;
    return getSideSetValue(data,data.day,exIdx,e,s,side);
  }
  if(setKey(data.day,exIdx,e,s)!==id)return null;
  return getSetValue(data,data.day,exIdx,e,s);
}
/* One exercise at a time is how a session is run; the whole list is one tap away.

  return 0;
}

function repRangeForExercise(desc){
  const m=String(desc||'').match(/(\d+)\s*x\s*(\d+)(?:\s*[-–]\s*(\d+))?/i);
  if(!m)return null;return{sets:+m[1],min:+m[2],max:+(m[3]||m[2])};
}
function lastValidSessionForTarget(rr){
  if(!lastEx)return null;const rows=Object.keys(lastEx).map(function(k){const x=lastEx[k];return{kg:parseFloat(x.kg)||0,r:parseFloat(x.sec||x.r)||0};}).filter(function(x){return x.r>0 && x.r<=Math.max(30,rr.max*2.5) && x.kg<500;});return rows.length?rows:null;
}
function nextTargetForExercise(e,timed){
  const rr=repRangeForExercise(e[1]), rows=lastValidSessionForTarget(rr);
  if(!rr||!rows)return null;
  const valid=rows.filter(function(x){return x.r>0;});
  if(!valid.length)return null;
  const allAtMax=valid.length>=rr.sets && valid.every(function(x){return x.r>=rr.max;});
  const maxKg=Math.max.apply(null,valid.map(function(x){return x.kg;}));
  if(allAtMax&&maxKg>0){const step=maxKg<20?1.25:2.5;const nk=maxKg+step;return{main:nk+' kg × '+rr.min+'–'+rr.max+' × '+rr.sets,sub:'Hai raggiunto il limite alto del range: aumenta gradualmente il carico.'};}
  const reps=valid.map(function(x){return x.r;});
  const target=Math.min(rr.max,Math.max(rr.min,Math.round((Math.min.apply(null,reps)+Math.max.apply(null,reps))/2)+1));
  if(timed)return{main:(maxKg?maxKg+' kg · ':'')+target+' sec × '+rr.sets,sub:'Prova ad aggiungere 1–2 secondi mantenendo una posizione pulita.'};
  return{main:(maxKg?maxKg+' kg · ':'')+target+' reps × '+rr.sets,sub:'Prova ad aggiungere 1 ripetizione mantenendo RIR e tecnica previsti.'};
}
// Rest = the "N sec" of a segment AFTER the prescription ("4-5 x 5-20 sec · tecnica · 60-90 sec" -> 90).
// A "sec" inside the prescription itself ("3 x 15-30 sec") is a HOLD time, never the rest. No explicit rest -> 90 s.
function restSecondsForExercise(desc){
  const parts=String(desc||'').split('·');
  for(let i=parts.length-1;i>=1;i--){const m=parts[i].match(/(\d+)\s*sec/i);if(m)return +m[1];}
  const first=parts[0]||'';
  if(/\d+\s*x\s*\d/i.test(first))return 90;
  const m=first.match(/(\d+)\s*sec/i);return m?+m[1]:90;
}

/* ===== What an exercise is measured in, and whether it carries a load =====
   This used to be decided by grepping the word "sec" out of the prescription
   string, so the same exercise got a Sec field in one day and a Reps field in
   another, and a bodyweight hold still asked for kilos. Both are now properties
   of the exercise. Anything not listed keeps the old prose rule, so no day
   changes by accident. */
const EX_MEASURE={'Tapis roulant inclinato':'time','Cyclette':'time','Camminata all\u2019aperto':'time','Vogatore':'time','Corsa leggera':'time','Corda':'time',            // 'time' = seconds, 'reps' = repetitions

  'Frog Stand':'time','Frog Stand Weight Shift':'reps','Frog Stand Toe Lift':'reps',
  'Vacuum addominale':'time','Plank':'time','CORE · Plank':'time','Hollow Body Hold':'time',
  'Active Hang':'time','Wrist Prep':'time','Chest-to-Wall Handstand':'time',
  'Wall Handstand Weight Shift':'time',
  'Dead Bug':'reps','CORE · Dead Bug':'reps','Hanging Knee Raise':'reps','CORE · Hanging Knee Raise':'reps',
  'Cable Crunch':'reps','CORE · Cable Crunch':'reps','Pallof Press (anti-rotazione)':'reps'
};
const EX_LOAD={'Tapis roulant inclinato':'bodyweight','Cyclette':'bodyweight','Camminata all\u2019aperto':'bodyweight','Vogatore':'bodyweight','Corsa leggera':'bodyweight','Corda':'bodyweight',               // 'bodyweight' = no kg field, 'external' = a load is entered
  // Only the holds and the wall work: things that genuinely never take a load in
  // this plan. Pull-up can be assisted or weighted, and her own history has Dead Bug
  // at 16 and 18 kg, so neither is listed — anything unlisted keeps its kg field.
  'L-Sit':'bodyweight','Tuck Support':'bodyweight','Tuck L-Sit':'bodyweight','Single-Leg L-Sit':'bodyweight',
  'L-Sit on Parallettes':'bodyweight','Frog Stand':'bodyweight','Frog Stand Weight Shift':'bodyweight',
  'Frog Stand Toe Lift':'bodyweight','Vacuum addominale':'bodyweight','CORE · Vacuum addominale':'bodyweight',
  'Plank':'bodyweight','CORE · Plank':'bodyweight','Hollow Body Hold':'bodyweight',
  'Active Hang':'bodyweight','Wrist Prep':'bodyweight','Wall Walk':'bodyweight',
  'Chest-to-Wall Handstand':'bodyweight','Wall Handstand Toe Taps':'bodyweight',
  'Wall Handstand Weight Shift':'bodyweight','Handstand Toe Taps':'bodyweight'
};

function exName(e){return String(e&&e[0]||'');}
/* An exercise added by hand is not in any table, so she declares what it is:
   two taps, measure and load. Declared always wins — she knows, the table guesses.
   Without the two taps it simply falls back to the old prose rule. */
function exMetaKey(name){return 'fede:exmeta:'+String(name||'').trim().toLowerCase();}
function exMetaGet(name){
  try{const raw=localStorage.getItem(exMetaKey(name)); return raw?JSON.parse(raw):null;}catch(e){return null;}
}
function exMetaSet(name,measure,load){
  const o={};
  if(measure==='time'||measure==='reps')o.m=measure;
  if(load==='bodyweight'||load==='external')o.l=load;
  if(!o.m&&!o.l)return null;
  try{localStorage.setItem(exMetaKey(name),JSON.stringify(o));}catch(e){}
  return o;
}
/* Add an exercise to today's day, through the same vetted path the coach uses:
   the stored plan is copied, the exercise appended, ids prepared, the result
   persisted. History is untouched. */
function addExerciseToDay(day,name,measure,load){
  const nm=String(name||'').trim();
  if(!nm)return {ok:false,error:'Serve un nome.'};
  const plan=coachEnsurePlan(), dp=plan&&plan[day];
  if(!dp||!Array.isArray(dp.ex))return {ok:false,error:'Non trovo quel giorno nel piano.'};
  if(dp.ex.some(function(e){return sameExerciseName(e[0],nm);}))return {ok:false,error:'È già in questa giornata.'};
  const known=makeExercise(nm);
  const ex=known?known:[nm,(measure==='time'?'3 x 20-30 sec':'3 x 8-12')+' · aggiunto da te',3];
  ex[4]=null;
  if(!known)exMetaSet(nm,measure,load);
  dp.ex.push(ex);
  preparePlanExerciseIds(plan); userPlan=plan; persistUserPlan();
  writeUserPlanMeta({customized:true,source:'added-by-user'});
  if(data&&data.day===day)save();
  return {ok:true,name:nm,fromLibrary:!!known};
}
/* The weight cell. A bodyweight exercise has no kilos to enter — but a set logged
   before this rule existed keeps its number, shown as it was recorded and not
   editable, because her history is not rewritten. */
function kgCell(e,id,v){
  const stored=String((v&&v.kg)||'');
  if(exLoad(e)!=='bodyweight')
    return '<div class="fld"><label>Peso (kg)</label><input data-set="'+id+'" data-f="kg" type="number" inputmode="decimal" value="'+esc(stored)+'"></div>';
  if(stored==='')return '';
  return '<div class="fld fld-legacy"><label>Registrato</label><div class="legacy-kg">'+esc(stored)+' kg</div></div>';
}
function exMeasure(e){
  const d=exMetaGet(exName(e)); if(d&&d.m)return d.m;
  const m=EX_MEASURE[exName(e)];
  if(m)return m;
  return /\bsec\b/i.test(String(e&&e[1]||'').split('·')[0])?'time':'reps';   // old prose rule
}
function exLoad(e){
  const d=exMetaGet(exName(e)); if(d&&d.l)return d.l;
  const l=EX_LOAD[exName(e)];
  if(l)return l;
  return 'external';
}
// Kept under its old name: everything else in the app asks the question this way.
function isTimedExercise(e){return exMeasure(e)==='time';}
// Count field for a set: Lab timed exercises use a dedicated "sec" field; everything else keeps "r" (reps).
function countField(e,day){return isTimedExercise(e)?{f:'sec',l:'Sec'}:{f:'r',l:'Reps'};}
// Value shown in the count field. A timed set logged before the Sec field existed (seconds stored as reps) is shown.
function countValue(v,cf){if(cf.f==='sec'&&(v.sec==null||v.sec===''))return v.r||'';return v[cf.f];}
// Lab activity in a record (any logged value or completed set in the Lab namespace). Read-only.
function labActivity(v){
  if(!v)return 0;let n=0;
  Object.keys(v.sets||{}).forEach(function(k2){const x=v.sets[k2];if(isLabDay(String(k2).split('|')[0])&&x&&((x.r||'')!==''||(x.sec||'')!==''||(x.kg||'')!==''))n++;});
  Object.keys(v.done||{}).forEach(function(k2){if(isLabDay(String(k2).split('|')[0])&&v.done[k2])n++;});
  return n;
}

   Il piano della PT resta parola per parola: cambia solo su quale giorno della
   settimana cade un menu', perche' i giorni di gambe vogliono il menu' piu'

(function allineaMenuAllAllenamento(){
  DIET_DAYS.forEach(function(d){ if(!d.pt)d.pt=d.n; });
  const scambi=[[4,5]];  // giovedi' <-> venerdi': il lower si sposta al giovedi'
  scambi.forEach(function(coppia){
    const a=DIET_DAYS.find(function(d){return d.k===coppia[0];});
    const b=DIET_DAYS.find(function(d){return d.k===coppia[1];});
    if(!a||!b)return;
    const m=a.meals; a.meals=b.meals; b.meals=m;
    const t=a.pt; a.pt=b.pt; b.pt=t;
    const al=DIET_ALLERGENS[a.k]; DIET_ALLERGENS[a.k]=DIET_ALLERGENS[b.k]; DIET_ALLERGENS[b.k]=al;
  });
})();

function dietParseIngredient(line){
  const m=String(line||'').trim().match(/^(.+?)\s+([0-9]+(?:[.,][0-9]+)?)\s*(?:g|ml)\b/i);
  if(!m)return null;
  return {name:m[1].trim(), q:parseFloat(m[2].replace(',','.'))};
}
function dietMealNutrition(meal){
  let kcal=0,prot=0,known=0,unknown=0;
  String(meal&&meal.ingredients||'').split('\n').forEach(function(line){
    const it=dietParseIngredient(line); if(!it)return;
    const v=DIET_NUTRI[it.name];
    if(!v){unknown++;return;}
    known++; kcal+=v[0]*it.q/100; prot+=v[1]*it.q/100;
  });
  return {kcal:Math.round(kcal),prot:Math.round(prot),known:known,unknown:unknown};
}
function dietDayNutrition(day){
  let kcal=0,prot=0,unknown=0;
  ((day&&day.meals)||[]).forEach(function(m){const n=dietMealNutrition(m);kcal+=n.kcal;prot+=n.prot;unknown+=n.unknown;});
  return {kcal:kcal,prot:prot,unknown:unknown};
}

function buildRound(g){return g>=50?Math.round(g/5)*5:Math.round(g);}
function buildPortion(role,name){

// L'icona del pasto: quella del diario dove esiste, le altre scelte per slot.
const DIET_SLOT_ICON={'Colazione':'\ud83e\udd5e','Spuntino mattutino':'\ud83c\udf4e',
  'Pranzo':'\ud83e\udd57','Merenda':'\ud83e\udd64','Merenda 2':'\ud83c\udf4c','Cena':'\ud83c\udf72'};
function dietSlotIcon(slot){
  const s=String(slot||'');
  if(DIET_SLOT_ICON[s])return DIET_SLOT_ICON[s];
  if(/spuntino|merenda/i.test(s))return '\ud83c\udf4e';
  if(/colazione/i.test(s))return '\ud83e\udd5e';
  if(/pranzo/i.test(s))return '\ud83e\udd57';
  if(/cena/i.test(s))return '\ud83c\udf72';
  return '\ud83c\udf7d\ufe0f';
}
function dietMinutes(t){const p=String(t||'').split(':');return (+p[0]||0)*60+(+p[1]||0);}
// Il pasto "di adesso": quello la cui fascia contiene l'ora. La fascia di un
// pasto va dal suo orario a quello del pasto successivo; prima del primo vale
// il primo, dopo l'ultimo vale l'ultimo.
function dietMealIndexAt(day,minuti){
  const m=(day&&day.meals)||[]; if(!m.length)return -1;
  if(minuti<dietMinutes(m[0].time))return 0;
  for(let i=m.length-1;i>=0;i--)if(minuti>=dietMinutes(m[i].time))return i;
  return 0;
}

/* ===== Asymmetry: what the two sides say, once there is something to say =====
   Recorded per side since before this version, so the history already carries it.
   This reads it back: for each unilateral exercise, the last sessions where both
   sides have a number, and the average gap. Reported only above 5% and only with
   at least two sessions — one lopsided set is not a finding. */
// The last N dated records, read straight from storage. Synchronous on purpose:
// evoHTML() builds its markup in one pass.
function recentRecords(n){
  const dates=[];
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&/^fede:\d{4}-\d{2}-\d{2}$/.test(k))dates.push(k.slice(5));}}catch(e){}
  dates.sort().reverse();
  const out=[];
  dates.slice(0,n||12).forEach(function(d){
    try{const r=JSON.parse(localStorage.getItem('fede:'+d)||'null');if(r){r._date=d;out.push(r);}}catch(e){}
  });
  return out;
}
/* ---- Andamento: cosa si vede dai record gia' registrati ----
   Niente di tutto questo tocca lo storico: legge e basta. */
function weekStartOf(date){
  const d=new Date(date); d.setHours(12,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+6)%7));   // lunedi'
  return d;
}
function dateFromKey(s){const p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2],12,0,0,0);}
// Una seduta conta se almeno una serie e' stata completata: un giorno aperto e
// chiuso senza registrare niente non e' un allenamento.
function sessionSummaries(records){
  const out=[];
  (records||[]).forEach(function(r){
    if(!r||!r._date)return;
    const v=vol(norm(r));
    if(!v.s)return;
    out.push({date:dateFromKey(r._date),key:r._date,day:r.day||'',series:v.s,volume:v.v});
  });
  out.sort(function(a,b){return a.date-b.date;});
  return out;
}
function weeklySessions(records,weeks,today){
  const n=weeks||8, ref=weekStartOf(today||new Date()), sess=sessionSummaries(records), out=[];
  for(let i=n-1;i>=0;i--){
    const ws=new Date(ref); ws.setDate(ws.getDate()-i*7);
    const we=new Date(ws); we.setDate(we.getDate()+7);
    const inWeek=sess.filter(function(x){return x.date>=ws&&x.date<we;});
    out.push({start:ws,sessions:inWeek.length,series:inWeek.reduce(function(a,x){return a+x.series;},0),
              volume:inWeek.reduce(function(a,x){return a+x.volume;},0),current:i===0});
  }
  return out;
}
function trendDelta(weeks){
  // Confronta le 4 settimane piene piu' recenti con le 4 precedenti. La settimana
  // in corso e' esclusa: non e' finita, e confrontarla falserebbe il verso.
  const full=weeks.filter(function(w){return !w.current;});
  if(full.length<8)return null;
  const a=full.slice(-4).reduce(function(x,w){return x+w.sessions;},0);
  const b=full.slice(-8,-4).reduce(function(x,w){return x+w.sessions;},0);
  return {recent:a,previous:b,diff:a-b};
}

/* Barre: sedute per settimana. Una serie sola, quindi nessuna legenda.
   Estremi arrotondati di 4px ancorati alla linea di base, 2px di distacco fra
   le barre, assi discreti. */
function weeklyBarsHTML(weeks){
  if(!weeks.length)return '';
  const max=Math.max(1,Math.max.apply(null,weeks.map(function(w){return w.sessions;})));
  const H=96;
  let bars='';
  weeks.forEach(function(w){
    const hgt=Math.round(w.sessions/max*H);
    bars+='<div class="tb-col"'+(w.sessions?' title="'+w.sessions+' sedute"':'')+'>'+
      '<div class="tb-val">'+(w.sessions||'')+'</div>'+
      '<div class="tb-track"><i class="tb-bar'+(w.current?' now':'')+'" style="height:'+(w.sessions?Math.max(hgt,6):0)+'px"></i></div>'+
      '<div class="tb-lab">'+w.start.getDate()+'/'+(w.start.getMonth()+1)+'</div></div>';
  });
  return '<div class="trend-bars">'+bars+'</div>';
}

/* Linea: volume per seduta. Stessa tinta, punti >=8px, etichette solo agli estremi. */
function sessionVolumeHTML(sess){
  const pts=sess.slice(-10).filter(function(x){return x.volume>0;});
  if(pts.length<2)return '';
  const W=300,H=104, vals=pts.map(function(x){return x.volume;});
  const mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), rg=(mx-mn)||1;
  const xy=pts.map(function(x,i){return [(i/(pts.length-1))*W, H-((x.volume-mn)/rg)*(H-14)-7];});
  const line=xy.map(function(c){return c[0].toFixed(1)+','+c[1].toFixed(1);}).join(' ');
  let dots='';
  xy.forEach(function(c,i){dots+='<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="4.5" fill="#fff" stroke="var(--chart)" stroke-width="2"><title>'+pts[i].volume+' kg · '+pts[i].date.toLocaleDateString(APP_LOCALE(),{day:'numeric',month:'short'})+'</title></circle>';});
  return '<svg class="trend-line" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+tr('Volume per seduta, ultime ','Volume per session, last ')+pts.length+tr(' sedute',' sessions')+'">'+
    '<polygon points="0,'+H+' '+line+' '+W+','+H+'" fill="var(--chart-fill)"/>'+
    '<polyline points="'+line+'" fill="none" stroke="var(--chart)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots+'</svg>'+
    '<div class="trend-ends"><span>'+pts[0].volume+' kg · '+pts[0].date.toLocaleDateString(APP_LOCALE(),{day:'numeric',month:'short'})+'</span>'+
    '<span>'+pts[pts.length-1].volume+' kg · '+pts[pts.length-1].date.toLocaleDateString(APP_LOCALE(),{day:'numeric',month:'short'})+'</span></div>';
}

  return h;

function asymmetryReport(records){
  const byEx={};
  (records||[]).forEach(function(rec){
    if(!rec||!rec.sets)return;
    const seen={};
    Object.keys(rec.sets).forEach(function(k){
      const m=/^(.*)\|(\d+)\|right$/.exec(k); if(!m)return;
      const left=rec.sets[k.replace(/\|right$/,'|left')], right=rec.sets[k];
      if(!left||!right)return;
      const parts=m[1].split('|'); const exId=parts[parts.length-1]||m[1];
      const gap=sideGap(right,left,'kg');
      const gapR=sideGap(right,left,'r');
      const g=(gap===null)?gapR:gap;
      if(g===null)return;
      const strongerRight=(parseFloat(right.kg||right.r)||0)>=(parseFloat(left.kg||left.r)||0);
      (seen[exId]=seen[exId]||[]).push({g:g,right:strongerRight});
    });
    Object.keys(seen).forEach(function(exId){
      const list=seen[exId];
      const avg=list.reduce(function(a,b){return a+b.g;},0)/list.length;
      const right=list.filter(function(x){return x.right;}).length>=list.length/2;
      (byEx[exId]=byEx[exId]||[]).push({gap:avg,right:right,date:rec._date||''});
    });
  });
  const out=[];
  Object.keys(byEx).forEach(function(exId){
    const ses=byEx[exId];
    if(ses.length<2)return;
    const avg=ses.reduce(function(a,b){return a+b.gap;},0)/ses.length;
    if(avg<0.05)return;
    const right=ses.filter(function(x){return x.right;}).length>=ses.length/2;
    out.push({id:exId,pct:Math.round(avg*100),sessions:ses.length,stronger:right?'destra':'sinistra'});
  });
  return out.sort(function(a,b){return b.pct-a.pct;});
}

// never from translated DOM text or from the textarea.
function buildBackupObject(){

  try{for(let i=0;i<localStorage.length;i++){const k2=localStorage.key(i);if(k2&&k2.indexOf('fede:')===0)backup.localStorage[k2]=localStorage.getItem(k2);}}catch(e){}
  return backup;
}
/* ---------- Safe import: validate -> preview -> snapshot -> merge (never blind overwrite) ---------- */
// Device-local state that is never imported from a backup.
const IMPORT_SKIP_KEYS=new Set(['fede:planVersion','fede:scheduleVersion','fede:schemaVersion','fede:bundledBackupRestored','fede:historyNameMigrationV4','fede:lang','fede:userPlanMeta']);
function importIsSkippedKey(k){return IMPORT_SKIP_KEYS.has(k)||k.indexOf('fede:autobackup:')===0;}
function importIsEmpty(v){
  if(v==null||v===''||v===0)return true;
  if(Array.isArray(v))return v.length===0;
  if(typeof v==='object')return Object.keys(v).every(function(x){return v[x]===''||v[x]==null;});
  return false;
}
function importClone(v){return v===undefined?undefined:JSON.parse(JSON.stringify(v));}
// Field-level merge of one day record. Local values win on conflict unless BOTH records carry
// _updatedAt and the incoming one is newer. Unknown fields are preserved. Returns {record, conflict}.
function mergeDayRecord(L,I){
  const out=importClone(L)||{}, inc=I||{};
  const incomingNewer=!!(out._updatedAt&&inc._updatedAt&&String(inc._updatedAt)>String(out._updatedAt));
  let conflict=false;
  const pick=function(lv,iv){ // returns [value, conflicted]
    if(iv===undefined)return [lv,false];
    if(JSON.stringify(lv)===JSON.stringify(iv))return [lv,false];
    if(lv===undefined||importIsEmpty(lv)&&!importIsEmpty(iv))return [importClone(iv),false];
    if(importIsEmpty(iv))return [lv,false];
    return [incomingNewer?importClone(iv):lv,true];
  };
  ['sets','done','warm'].forEach(function(f){
    const lm=(out[f]&&typeof out[f]==='object')?out[f]:{}, im=(inc[f]&&typeof inc[f]==='object')?inc[f]:{};
    Object.keys(im).forEach(function(k2){const r=pick(lm[k2],im[k2]);lm[k2]=r[0];if(r[1])conflict=true;});
    out[f]=lm;
  });
  const localHasWork=Object.keys(L&&L.sets||{}).length+Object.keys(L&&L.done||{}).length>0;
  if(inc.day!==undefined&&!localHasWork&&Object.keys(inc.sets||{}).length+Object.keys(inc.done||{}).length>0)out.day=inc.day;
  else if(inc.day!==undefined&&out.day!==inc.day&&localHasWork){conflict=true;if(incomingNewer)out.day=inc.day;}
  ['note','weight','water'].forEach(function(f){const r=pick(out[f],inc[f]);out[f]=r[0];if(r[1])conflict=true;});
  if(inc.meas&&typeof inc.meas==='object'){out.meas=out.meas&&typeof out.meas==='object'?out.meas:{};Object.keys(inc.meas).forEach(function(f){const r=pick(out.meas[f],inc.meas[f]);out.meas[f]=r[0];if(r[1])conflict=true;});}
  if(inc.food&&typeof inc.food==='object'){out.food=out.food&&typeof out.food==='object'?out.food:{};Object.keys(inc.food).forEach(function(m){const r=pick(out.food[m],inc.food[m]);out.food[m]=r[0];if(r[1])conflict=true;});}
  const noMap=function(x){return !(Array.isArray(x.dayEx)&&x.dayEx.length)&&!(Array.isArray(x.dayExIds)&&x.dayExIds.length);};
  if(noMap(out)&&!noMap(inc)){out.dayEx=importClone(inc.dayEx)||[];out.dayExIds=importClone(inc.dayExIds)||[];}
  Object.keys(inc).forEach(function(f){if(!(f in out))out[f]=importClone(inc[f]);}); // unknown fields preserved
  if(inc._updatedAt&&(!out._updatedAt||String(inc._updatedAt)>String(out._updatedAt)))out._updatedAt=inc._updatedAt;
  return {record:out,conflict:conflict};
}
function parseBackupText(txt){
  let b=null;
  try{b=JSON.parse(String(txt||''));}catch(e){return {ok:false,error:'Il testo non è un JSON valido.'};}
  if(!b||typeof b!=='object'||Array.isArray(b))return {ok:false,error:'Formato backup non riconosciuto.'};
  if(b.format!==undefined&&b.format!=='fede-training-complete')return {ok:false,error:'Formato backup diverso da "fede-training-complete".'};
  const hasLS=b.localStorage&&typeof b.localStorage==='object'&&!Array.isArray(b.localStorage);
  if(!hasLS&&!b.profile&&!b.userPlan&&!b.goals)return {ok:false,error:'Il backup non contiene dati Fede Training.'};
  return {ok:true,backup:b};
}
// READ-ONLY analysis: what an import would do. Nothing is written.
function analyzeBackup(b){
  const items={}, warnings=[], res={add:[],identical:[],merge:[],conflict:[],skip:[],invalid:[],planStatus:'none',exportedAt:b.exportedAt||null,version:b.version||null,items:items,warnings:warnings};
  const src=Object.assign({},(b.localStorage&&typeof b.localStorage==='object')?b.localStorage:{});
  // Top-level copies are only used when the localStorage section lacks them.
  if(b.profile&&src['fede:profile']===undefined)src['fede:profile']=JSON.stringify(b.profile);
  if(b.userPlan&&src['fede:userPlan']===undefined)src['fede:userPlan']=JSON.stringify(b.userPlan);
  if(b.goals&&src['fede:goals']===undefined)src['fede:goals']=JSON.stringify(b.goals);
  Object.keys(src).forEach(function(k2){
    const v=src[k2];
    if(k2.indexOf('fede:')!==0){res.skip.push(k2);return;}
    if(importIsSkippedKey(k2)){res.skip.push(k2);return;}
    if(typeof v!=='string'){res.invalid.push(k2);warnings.push(k2+': valore non testuale ignorato');return;}
    const isDay=/^fede:\d{4}-\d{2}-\d{2}$/.test(k2);
    let inc=null;
    if(isDay){try{inc=JSON.parse(v);}catch(e){inc=null;}if(!inc||typeof inc!=='object'||Array.isArray(inc)){res.invalid.push(k2);warnings.push(k2+': giornata non valida ignorata');return;}}
    const local=localStorage.getItem(k2);
    if(k2==='fede:userPlan'){
      let p=null;try{p=JSON.parse(v);}catch(e){p=null;}
      if(!isValidPlan(p)){res.invalid.push(k2);warnings.push('Piano nel backup non valido: ignorato');return;}
      if(local==null){res.add.push(k2);items[k2]={action:'add',value:v};res.planStatus='new';}
      else if(local===v){res.identical.push(k2);res.planStatus='identical';}
      else{res.conflict.push(k2);items[k2]={action:'keep-local',value:v};res.planStatus='different';}
      return;
    }
    if(local==null){res.add.push(k2);items[k2]={action:'add',value:v};return;}
    if(local===v){res.identical.push(k2);return;}
    if(isDay){
      let L=null;try{L=JSON.parse(local);}catch(e){L=null;}
      if(!L||typeof L!=='object'){res.conflict.push(k2);items[k2]={action:'keep-local',value:v};return;}
      const m=mergeDayRecord(L,inc), merged=JSON.stringify(m.record);
      if(merged===local&&!m.conflict){res.identical.push(k2);return;}
      (m.conflict?res.conflict:res.merge).push(k2);
      items[k2]={action:'merge',value:merged,incoming:v,local:local,conflict:m.conflict};
      return;
    }
    if(k2.indexOf('fede:exnote:')===0&&local===''){res.merge.push(k2);items[k2]={action:'fill-empty',value:v};return;}
    res.conflict.push(k2);items[k2]={action:'keep-local',value:v};
  });
  return res;
}
// Applies an analysis. ALWAYS takes a verified snapshot first (aborts if impossible). Never deletes.
// Conflicting values that are not written are stashed in fede:importconflict:<timestamp>.
function applyBackupImport(res,opts){
  opts=opts||{};
  flushSave();
  const snapshotKey=createSafetySnapshot('pre-import');
  if(!snapshotKey)return {ok:false,error:'Impossibile creare la copia di sicurezza: importazione annullata, nessun dato modificato.'};
  const stash={createdAt:new Date().toISOString(),sourceExportedAt:res.exportedAt||null,snapshot:snapshotKey,keptLocal_incomingValue:{},replacedLocal_previousValue:{}};
  let written=0;
  Object.keys(res.items).forEach(function(k2){
    const it=res.items[k2];
    if(k2==='fede:userPlan'&&it.action==='keep-local'){
      if(opts.replacePlan){let p=null;try{p=JSON.parse(it.value);}catch(e){p=null;}
        if(isValidPlan(p)){replaceUserPlanSafely(p,'import-replace-plan',{customized:true});written++;return;}}
      stash.keptLocal_incomingValue[k2]=it.value;return;
    }
    if(it.action==='keep-local'){stash.keptLocal_incomingValue[k2]=it.value;return;}
    if(it.action==='merge'){
      if(it.conflict){stash.keptLocal_incomingValue[k2]=it.incoming;stash.replacedLocal_previousValue[k2]=it.local;}
      localStorage.setItem(k2,it.value);written++;return;
    }
    if(it.action==='add'||it.action==='fill-empty'){localStorage.setItem(k2,it.value);written++;}
  });
  let stashKey=null;
  if(Object.keys(stash.keptLocal_incomingValue).length||Object.keys(stash.replacedLocal_previousValue).length){
    stashKey='fede:importconflict:'+safetyStamp();localStorage.setItem(stashKey,JSON.stringify(stash));
  }
  // Verification: every written key holds exactly the intended value.
  const bad=Object.keys(res.items).filter(function(k2){const it=res.items[k2];return (it.action==='add'||it.action==='merge'||it.action==='fill-empty')&&localStorage.getItem(k2)!==it.value;});
  return {ok:bad.length===0,written:written,snapshotKey:snapshotKey,stashKey:stashKey,unverified:bad};
}

function chartHTML(){
  if(hist.length<2)return '<div class="note">Registra il peso per almeno due giorni per vedere il grafico.</div>';
  return lineChart(hist.map(function(x){return{d:x.d,w:x.w};}));
}
function lineChart(pts,unit){
  const u=unit||'kg';
  if(pts.length<2)return '<div class="note">Servono almeno due punti per il grafico.</div>';
  const ws=pts.map(function(x){return x.w;});
  const mn=Math.min.apply(null,ws)-0.5, mx=Math.max.apply(null,ws)+0.5, rg=(mx-mn)||1;
  const W=300,H=110;
  const coords=pts.map(function(x,i){
    const px=pts.length>1?(i/(pts.length-1))*W:0;
    const py=H-((x.w-mn)/rg)*H;
    return px.toFixed(1)+','+py.toFixed(1);});
  const line=coords.join(' ');
  const area='0,'+H+' '+line+' '+W+','+H;
  let dots='';
  pts.forEach(function(x,i){
    const px=pts.length>1?(i/(pts.length-1))*W:0;
    const py=H-((x.w-mn)/rg)*H;
    dots+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3.5" fill="#fff" stroke="var(--chart)" stroke-width="2"/>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:120px;overflow:visible">'+
    '<polygon points="'+area+'" fill="var(--chart-fill)"/>'+
    '<polyline points="'+line+'" fill="none" stroke="var(--chart)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots+'</svg>'+
    '<div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);font-weight:700;margin-top:6px">'+
    '<span>'+pts[0].w+' '+u+' · '+pts[0].d.toLocaleDateString(APP_LOCALE(),{day:'numeric',month:'short'})+'</span>'+
    '<span>'+pts[pts.length-1].w+' '+u+' · '+pts[pts.length-1].d.toLocaleDateString(APP_LOCALE(),{day:'numeric',month:'short'})+'</span></div>';
}
function ringHTML(pct){
  const r=38, c=2*Math.PI*r, off=c-(pct/100)*c;
  return '<svg class="ring" viewBox="0 0 96 96">'+
    '<circle cx="48" cy="48" r="'+r+'" fill="none" stroke="var(--chart-soft)" stroke-width="9"/>'+
    '<circle cx="48" cy="48" r="'+r+'" fill="none" stroke="var(--chart)" stroke-width="9" stroke-linecap="round" '+
    'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 48 48)"/>'+
    '<text x="48" y="53" text-anchor="middle" font-size="19" font-weight="800" fill="#1b1f33" font-family="Manrope,sans-serif">'+
    Math.round(pct)+'%</text></svg>';
}

 'Poke bowl di riso, salmone e avocado':'Rice, salmon and avocado poke bowl',
 '1. Sbatti le uova in una ciotola. Scalda l’olio in padella, versa e rimesta senza fermarti finché rapprendono. 2. Spalma il pomodoro sul pane tostato e metti sopra le uova. Completa con l’Havarti e la mela.':'1. Beat the eggs in a bowl. Heat the oil in a pan, pour them in and keep stirring until they set. 2. Spread the tomato on the toast and put the eggs on top. Finish with the Havarti and the apple.',
 '1. Fai appassire cipolla e peperone tagliati fini. 2. Pepa il pollo a dadi e uniscilo al soffritto, lascia dorare. 3. Unisci il riso e tostalo un minuto. 4. Scalda il brodo con il curry. 5. Bagna con il brodo caldo e cuoci 15 minuti. 6. Lascia riposare 5 minuti.':'1. Soften the finely sliced onion and pepper. 2. Pepper the diced chicken and add it, letting it brown. 3. Add the rice and toast it for a minute. 4. Warm the stock with the curry. 5. Pour in the hot stock and cook for 15 minutes. 6. Let it rest 5 minutes.',
 'Frulla la proteina con la bevanda di mandorle e la banana. Burro di arachidi, semi di lino, mandorle e noci a parte o dentro, come preferisci.':'Blend the protein with the almond drink and the banana. Peanut butter, flaxseed, almonds and walnuts on the side or blended in, whichever you prefer.',
 '1. Fai appassire la cipolla e i peperoni a dadini; quando la cipolla imbiondisce unisci il pomodoro e cuoci piano. 2. In padella antiaderente cuoci l’uovo coperto, così si rapprende col suo vapore. 3. Servi l’uovo sulla peperonata, con il pane.':'1. Soften the onion and the diced peppers; once the onion turns golden add the tomato and cook gently. 2. In a non-stick pan cook the egg covered, so it sets in its own steam. 3. Serve the egg on the pepper stew, with the bread.',
 '1. Scalda la bevanda di mandorle e, quando sfiora il bollore, unisci l’avena. Cuoci a fuoco molto basso mescolando, 5 minuti. 2. Quando diventa cremoso togli dal fuoco: se stringe troppo allunga con altra bevanda. 3. Aggiungi mirtilli e noci tritate, e il miele. Si può preparare la sera prima.':'1. Heat the almond drink and, just before it boils, stir in the oats. Cook on a very low heat, stirring, for 5 minutes. 2. When it turns creamy take it off the heat: if it thickens too much, loosen it with more drink. 3. Add blueberries, chopped walnuts and the honey. You can make it the night before.',
 '1. Cuoci la pasta in acqua abbondante, 10 minuti, scola e tieni da parte. 2. Lava le zucchine e tagliale a dadini; falle stufare a fuoco medio con l’olio. Quando ammorbidiscono unisci gli spinaci tritati e gli anacardi. 3. Salta il manzo a striscioline a fuoco vivo. 4. Unisci la pasta e impiatta.':'1. Cook the pasta in plenty of water, 10 minutes, drain and set aside. 2. Wash and dice the courgettes; stew them over a medium heat with the oil. Once soft, add the chopped spinach and the cashews. 3. Stir-fry the beef strips over a high heat. 4. Stir through the pasta and serve.',
 '1. Forno a 175°: la patata dolce intera con la buccia, 45 minuti. 2. Taglia a julienne peperone, zucchine e cipolla e saltale a fuoco vivo finché dorano. 3. Scotta il salmone sulla piastra. 4. Servi il salmone sulle verdure, con aneto.':'1. Oven at 175°: the whole sweet potato in its skin, 45 minutes. 2. Julienne the pepper, courgette and onion and stir-fry over a high heat until golden. 3. Sear the salmon on the griddle. 4. Serve the salmon on the vegetables, with dill.',
 '1. Ammolla il riso integrale almeno 20 minuti, poi cuocilo nel triplo d’acqua 25-30 minuti; scola. 2. Salta i gamberoni sgusciati 5 minuti, finché la carne è bianca. 3. Unisci riso e gamberoni in una ciotola, aggiungi pomodorini e olive tagliate a metà. 4. Schiaccia la polpa dell’avocado con una forchetta e condiscila con il succo di lime. 5. Incorpora all’insalata e mescola.':'1. Soak the brown rice for at least 20 minutes, then cook it in three times its volume of water for 25-30 minutes; drain. 2. Fry the peeled prawns for 5 minutes, until the flesh is white. 3. Combine rice and prawns in a bowl, add the cherry tomatoes and the halved olives. 4. Mash the avocado flesh with a fork and dress it with the lime juice. 5. Fold it through the salad and mix.',
 '1. Taglia a dadini il petto di tacchino. 2. Metti il songino alla base, sopra il mais e il tonno sgocciolato, i dadini di tacchino e le noci tritate. 3. Condisci con l’olio. Spalma l’hummus sulle fette di pane tostato.':'1. Dice the turkey breast. 2. Put the lamb\'s lettuce at the base, then the sweetcorn and the drained tuna, the diced turkey and the chopped walnuts. 3. Dress with the oil. Spread the hummus on the slices of toast.',
 '1. Cuoci la quinoa come da confezione. 2. Fai appassire aglio, cipolla, carota e porro tritati; unisci pomodoro e zucchine e cuoci piano finché diventa una salsa. 3. Unisci i ceci scolati e scalda qualche minuto. 4. Servi con la quinoa e l’uovo.':'1. Cook the quinoa as per the packet. 2. Soften the chopped garlic, onion, carrot and leek; add the tomato and courgette and cook gently until it becomes a sauce. 3. Stir in the drained chickpeas and warm through. 4. Serve with the quinoa and the egg.',
 '1. Forno a 200°: patata a fettine sottili con l’olio e il pepe, 25-30 minuti finché croccante. 2. Prepara la peperonata facendo appassire cipolla e peperoni e unendo il pomodoro. 3. Scotta il tonno sulla piastra, 2 minuti per lato: dentro deve restare rosato.':'1. Oven at 200°: thinly sliced potato with the oil and pepper, 25-30 minutes until crisp. 2. Make the pepper stew by softening the onion and peppers and adding the tomato. 3. Sear the tuna on the griddle, 2 minutes a side: it should stay pink inside.',
 '1. Forno a 200°. In una teglia metti i pomodorini interi e la feta al centro, olio, sale, pepe e origano: 25 minuti. 2. Intanto lessa gli gnocchi. 3. Schiaccia la feta cotta con i pomodorini a formare una crema e mescolaci gli gnocchi. Basilico fresco alla fine.':'1. Oven at 200°. Put the whole cherry tomatoes in a dish with the feta in the middle, oil, salt, pepper and oregano: 25 minutes. 2. Meanwhile boil the gnocchi. 3. Mash the cooked feta with the tomatoes into a sauce and stir the gnocchi through it. Fresh basil at the end.',
 '1. Cuoci il pollo sulla piastra e taglialo a dadini. 2. Taglia a dadini pomodoro, cetriolo, cipolla e ravanelli e mescola con il pollo. 3. Condisci con olio, succo di limone e coriandolo. 4. Scalda le fajitas e riempile, con l’avocado a fette.':'1. Griddle the chicken and dice it. 2. Dice the tomato, cucumber, onion and radishes and mix them with the chicken. 3. Dress with oil, lemon juice and coriander. 4. Warm the fajitas and fill them, with the sliced avocado.',
 '1. Forno a 200°: patata a fettine con olio e pepe, 25-30 minuti. 2. Peperonata: cipolla e peperoni appassiti, poi il pomodoro, cuocendo piano. 3. Cuoci l’hamburger sulla piastra e servilo sulla peperonata.':'1. Oven at 200°: sliced potato with oil and pepper, 25-30 minutes. 2. Pepper stew: softened onion and peppers, then the tomato, cooking gently. 3. Cook the burger on the griddle and serve it on the pepper stew.',
 '1. Strapazza le uova in padella a fuoco basso, mescolando. 2. Condisci la rucola con olio e semi di zucca. 3. Servi le uova con il salmone affumicato e l’insalata. Hummus sulle fette di pane tostato.':'1. Scramble the eggs in a pan over a low heat, stirring. 2. Dress the rocket with oil and pumpkin seeds. 3. Serve the eggs with the smoked salmon and the salad. Hummus on the slices of toast.',
 '1. Lessa la patata e schiacciala con l’olio e il prezzemolo. 2. Salta champignon e asparagi in padella. 3. Cuoci il petto di pollo sulla piastra e servilo con le verdure e il puré.':'1. Boil the potato and mash it with the oil and the parsley. 2. Fry the mushrooms and asparagus in a pan. 3. Griddle the chicken breast and serve it with the vegetables and the mash.',
 '1. Cuoci il riso e lascialo intiepidire. 2. Taglia il salmone a cubetti, il pomodoro a spicchi e l’avocado a fettine. 3. Componi la ciotola: riso alla base, poi salmone, pomodoro, avocado e rucola. Semi di zucca e salsa di soia alla fine.':'1. Cook the rice and let it cool to warm. 2. Cube the salmon, cut the tomato into wedges and slice the avocado. 3. Build the bowl: rice at the base, then salmon, tomato, avocado and rocket. Pumpkin seeds and soy sauce at the end.',

// Translation is display-only: text inside user-editable fields (notes, backup JSON) and inside
// [data-no-i18n] containers is never touched, so stored/exported data is never altered.
function i18nProtectedNode(n){
  for(let el=n&&n.parentNode;el&&el.nodeType===1;el=el.parentNode){
    const tag=String(el.nodeName||'').toUpperCase();
    if(tag==='TEXTAREA'||tag==='INPUT'||tag==='SCRIPT'||tag==='STYLE')return true;
    if(el.hasAttribute&&el.hasAttribute('data-no-i18n'))return true;
  }
  return false;
}
let __appEnKeys=null;
function APP_EN_KEYS(){if(!__appEnKeys)__appEnKeys=Object.keys(APP_EN).sort(function(a,b){return b.length-a.length;});return __appEnKeys;}
function applyLanguage(){if(getAppLanguage()!=='en')return;
  // La barra in basso e la sfera del coach vivono fuori da #page: vanno tradotte anche loro.
  ['page','nav','minicoach'].forEach(function(id){const el=document.getElementById(id);if(el)applyLanguageTo(el);});}
// Una passata sola, da sinistra a destra: a ogni posizione vince la chiave piu'
// lunga che combacia, e quello che e' gia' stato tradotto non viene piu' guardato.
// Senza questo, "Progressione" diventava "Progression" e poi la chiave piu' corta
// "Progressi" lo riscriveva in "Progresson".
let __appEnByChar=null;
function APP_EN_BY_CHAR(){
  if(!__appEnByChar){__appEnByChar={};
    APP_EN_KEYS().forEach(function(k){const c=k.charAt(0);(__appEnByChar[c]=__appEnByChar[c]||[]).push(k);});}
  return __appEnByChar;
}
function i18nLetter(c){return !!c&&/[\p{L}\p{N}]/u.test(c);}
function i18nText(s){
  const t=String(s==null?'':s); if(!t)return t;
  const byChar=APP_EN_BY_CHAR(); let out='', i=0;
  while(i<t.length){
    const cand=byChar[t.charAt(i)]; let hit=null;
    if(cand)for(let z=0;z<cand.length;z++){const k=cand[z];
      // Confine di parola: "Progressi" non deve mordere dentro "Progression".
      if(!t.startsWith(k,i))continue;
      if(i18nLetter(k.charAt(0))&&i18nLetter(t.charAt(i-1)))continue;
      if(i18nLetter(k.charAt(k.length-1))&&i18nLetter(t.charAt(i+k.length)))continue;
      hit=k;break;}   // le chiavi sono gia' ordinate dalla piu' lunga
    if(hit){out+=APP_EN[hit]; i+=hit.length;} else {out+=t.charAt(i); i++;}
  }
  return out;
}
function applyLanguageTo(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){return i18nProtectedNode(n)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
  const nodes=[]; while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(function(n){const v=i18nText(n.nodeValue); if(v!==n.nodeValue)n.nodeValue=v;});
  root.querySelectorAll('input,textarea').forEach(function(e){if(e.placeholder)e.placeholder=i18nText(e.placeholder);});
  root.querySelectorAll('[aria-label]').forEach(function(e){const a=e.getAttribute('aria-label'); if(a)e.setAttribute('aria-label',i18nText(a));});
}

    'Forma a clessidra','Forza','Massa muscolare','Definizione','Mantenimento']},
  {k:'level', q:'A che punto sei?', opts:[
    'Principiante','Intermedio','Avanzato']},
  {k:'days', q:'Quanti giorni a settimana?', opts:['2','3','4','5'], suffix:' giorni'},
  {k:'duration', q:'Quanto dura una seduta?', opts:[

  {k:'location', q:'Dove ti alleni?', opts:['Palestra','Casa','Palestra e casa']},
  {k:'equipment', q:'Che attrezzatura hai?', multi:true, opts:[
    'Macchine','Bilanciere','Manubri','Cavi','Elastici','Sbarra','Corpo libero']},
  {k:'avoid', q:'C\u2019\u00e8 qualcosa da evitare?', multi:true, optional:true, opts:[
    'Spalle','Schiena','Ginocchia','Polsi','Collo']},
  {k:'measures', q:'Le tue misure', measures:true}
];
const SETUP_REQUIRED=['goal','level','days','duration','location','equipment'];
function profileComplete(p){
  if(!p)return false;
  if(!SETUP_REQUIRED.every(function(k){return String(p[k]||'').trim()!=='' && p[k]!==0;}))return false;
  return !!(parseFloat(p.weight)>0 && parseFloat(p.height)>0);
}
let setupStep=0, setupDraft=null;
function setupStart(){
  setupDraft=Object.assign({},DEFAULT_PROFILE,profile||{},
    {equipment:String((profile&&profile.equipment)||''),avoid:String((profile&&profile.avoid)||'')});
  setupStep=0;
}
function setupListOf(k){const v=String(setupDraft[k]||'').trim();return v?v.split(/\s*\u00b7\s*|\s*,\s*/).filter(Boolean):[];}
function setupPick(k,v,multi){
  if(!setupDraft)setupStart();
  if(!multi){setupDraft[k]=setupDraft[k]===v?'':v;return;}
  const a=setupListOf(k), i=a.indexOf(v);
  if(i>-1)a.splice(i,1); else a.push(v);
  setupDraft[k]=a.join(' \u00b7 ');
}
function setupStepOk(i){
  const st=SETUP_STEPS[i]; if(!st)return true;
  if(st.optional)return true;
  if(st.measures)return parseFloat(setupDraft&&setupDraft.weight)>0&&parseFloat(setupDraft&&setupDraft.height)>0;
  return String((setupDraft&&setupDraft[st.k])||'').trim()!=='';
}
function setupFinish(){
  if(!setupDraft)return {ok:false,error:'Niente da salvare.'};
  if(!SETUP_STEPS.every(function(_,i){return setupStepOk(i);}))
    return {ok:false,error:'Manca ancora qualcosa.'};
  const next=Object.assign({},DEFAULT_PROFILE,profile||{},setupDraft);
  next.days=parseInt(next.days,10)||0;
  next.setupComplete=profileComplete(next);
  if(!next.setupComplete)return {ok:false,error:'Il profilo non \u00e8 completo.'};
  profile=next; saveProfile();
  return {ok:true};
}
function setupHTML(){
  if(!setupDraft)setupStart();
  const st=SETUP_STEPS[setupStep]||SETUP_STEPS[0];
  const n=SETUP_STEPS.length;
  let h=hdr('Il tuo profilo','Passo '+(setupStep+1)+' di '+n);
  h+='<div class="wrap"><div class="setup-bar"><i style="width:100%;transform:scaleX('+(setupStep/(n-1)).toFixed(3)+')"></i></div>';
  h+='<h2 class="setup-q">'+esc(st.q)+'</h2>';
  if(st.measures){
    h+='<div class="setup-measures">'
      +'<div><label>Peso</label><div class="setup-field"><input id="su_weight" type="number" inputmode="decimal" placeholder="53" value="'+esc(setupDraft.weight||'')+'"><span>kg</span></div></div>'
      +'<div><label>Altezza</label><div class="setup-field"><input id="su_height" type="number" inputmode="numeric" placeholder="150" value="'+esc(setupDraft.height||'')+'"><span>cm</span></div></div></div>'
      +'<div class="note" style="margin-top:10px">Sono gli unici due numeri da scrivere. Tutto il resto si tocca.</div>';
  }else{
    const sel=st.multi?setupListOf(st.k):[String(setupDraft[st.k]||'')];
    h+='<div class="setup-opts">'+st.opts.map(function(o){
      const on=sel.indexOf(o)>-1;
      return '<button class="setup-opt'+(on?' on':'')+'" data-setup="'+esc(st.k)+'|'+esc(o)+'|'+(st.multi?'1':'0')+'">'
        +esc(o)+(st.suffix&&!st.multi?esc(st.suffix):'')+'</button>';}).join('')+'</div>';
    if(st.multi)h+='<div class="note" style="margin-top:8px">Puoi sceglierne pi\u00f9 di una'+(st.optional?', oppure nessuna':'')+'.</div>';
  }
  h+='<div class="setup-nav">'
    +(setupStep>0?'<button class="btn ghost" data-setupback="1">Indietro</button>':'')
    +(setupStep<n-1
      ? '<button class="btn" data-setupnext="1"'+(setupStepOk(setupStep)?'':' disabled')+'>Avanti</button>'
      : '<button class="btn" data-setupdone="1"'+(setupStepOk(setupStep)?'':' disabled')+'>Finito</button>')
    +'</div>';
  h+='<div class="note" id="su_hint" style="margin-top:9px'+(setupStepOk(setupStep)?';display:none':'')+'">Scegli per proseguire: non registro un profilo a met\u00e0.</div>';
  return h+'</div>';
}

// READ-ONLY: counts set/done/warm keys written with the legacy "Day N|" prefix. Nothing is changed.
function countLegacyDayKeys(){
  let n=0;
  for(let i=0;i<localStorage.length;i++){
    const k2=localStorage.key(i); if(!k2||!/^fede:\d{4}-\d{2}-\d{2}$/.test(k2))continue;
    let v=null; try{v=JSON.parse(localStorage.getItem(k2));}catch(e){continue;}
    if(!v||typeof v!=='object')continue;
    ['sets','done','warm'].forEach(function(f){Object.keys(v[f]||{}).forEach(function(x){if(/^Day\s*[1-5]\|/.test(x))n++;});});
  }
  return n;
}

/* ---------- Motion P0: screen-change flag (visual only; reads state, never writes data) ---------- */
// The same screen re-rendered (water, ticks, tabs, Coach messages...) must NOT replay the entry.
let __motionScreenKey=null, __motionEnterAt=0, __motionEnterTimer=null;
function motionScreenKey(){
  if(view==='exercise')return 'exercise|'+(data&&data.day)+'|'+exIdx;
  if(view==='workout')return 'workout|'+(data&&data.day);
  return String(view);
}
function applyScreenEnter(){
  const page=document.getElementById('page'); if(!page||!page.setAttribute)return;
  const key=motionScreenKey(), now=Date.now();
  if(__motionScreenKey===null){__motionScreenKey=key;return;} // first paint: no animation
  if(key!==__motionScreenKey){
    __motionScreenKey=key; __motionEnterAt=now;
    page.style.setProperty('--enter-delay','0ms');
    page.setAttribute('data-enter','');
    clearTimeout(__motionEnterTimer);
    __motionEnterTimer=setTimeout(function(){page.removeAttribute('data-enter');},400);
    return;
  }
  // Same screen: never restart. If an entry is still running, the new content continues it seamlessly.
  if(page.hasAttribute('data-enter'))page.style.setProperty('--enter-delay',(-(now-__motionEnterAt))+'ms');
}
function render(){
  try{renderCore();applyLanguage();try{applyScreenEnter();}catch(e){}}
  catch(err){
    console.error('Fede Training render error',err);

/* ---------- Rest timer (UI only; no data) ----------
   Countdown from an END TIMESTAMP, so it stays correct when iOS suspends the app. Kept across re-renders of the
   same exercise; reset only when a DIFFERENT exercise screen is shown. */
let restTimer={key:null,endAt:0,remaining:null,id:null};
function restFmt(sec){sec=Math.max(0,Math.round(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}
function restLeft(){return restTimer.endAt?Math.max(0,Math.ceil((restTimer.endAt-Date.now())/1000)):(restTimer.remaining==null?null:restTimer.remaining);}
function restPaint(){const el=document.getElementById('restTimer'),left=restLeft();if(el&&left!=null)el.textContent=restFmt(left);}
function restTick(){
  const left=restLeft(); restPaint();
  if(restTimer.endAt&&left===0){clearInterval(restTimer.id);restTimer.id=null;restTimer.endAt=0;restTimer.remaining=0;try{navigator.vibrate&&navigator.vibrate([150,80,150]);}catch(e){}}
}
function restTimerAttach(el,initial){
  const key=view==='exercise'?exDay()+'|'+exIdx:null;
  if(key&&restTimer.key!==key){if(restTimer.id)clearInterval(restTimer.id);restTimer={key:key,endAt:0,remaining:null,id:null};}
  if(el)restPaint();
}
function restTimerStart(initial){
  const left=restLeft(), base=(left==null||left===0)?initial:left;
  restTimer.remaining=null; restTimer.endAt=Date.now()+base*1000;
  if(!restTimer.id)restTimer.id=setInterval(restTick,250);
  restTick();
}
function restTimerAdd(sec,initial){
  if(restTimer.endAt)restTimer.endAt+=sec*1000; else restTimer.remaining=(restTimer.remaining==null?initial:restTimer.remaining)+sec;
  restPaint();
}
function restTimerReset(initial){
  if(restTimer.id)clearInterval(restTimer.id);
  restTimer.id=null; restTimer.endAt=0; restTimer.remaining=initial; restPaint();
}

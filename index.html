<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Fede Training · V5</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F4EBDD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fede">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
body{margin:0;background:#fbfbfc}

@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#fbfbfc;--card:#fff;--ink:#1b1f33;--dim:#8a8d9c;--line:#eceaf1;
  --rose:#c9557f;--rose-d:#a63f66;--rose-l:#fbe9f0;--rose-b:#f5c7da;
  --navy:#1e2340;--ok:#12b76a;--amber:#f5a524;--violet:#7b6cf0;--sky:#4aa8e0;
  --sh:0 4px 18px -6px rgba(30,35,64,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#app{background:var(--bg);color:var(--ink);font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;max-width:660px;margin:0 auto;padding-bottom:96px;position:relative}
.wrap{padding:0 16px}

/* ---- top gradient header ---- */
.top{background:
  radial-gradient(420px 260px at 22% 8%, #f6c9dc 0%, rgba(246,201,220,.55) 38%, rgba(255,255,255,0) 72%),
  radial-gradient(340px 220px at 88% 0%, #efd7ea 0%, rgba(255,255,255,0) 68%),
  #fff;
  padding:16px 16px 20px;border-radius:0 0 26px 26px}
.toprow{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ava{width:40px;height:40px;border-radius:50%;background:linear-gradient(140deg,var(--rose-b),var(--rose));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;flex-shrink:0}
.logo{flex:1;font-family:'Playfair Display',serif;font-size:23px;letter-spacing:5px;font-weight:600;text-align:center}
.logo small{display:block;font-family:'Manrope',sans-serif;font-size:8.5px;letter-spacing:4.5px;font-weight:700;color:var(--dim);margin-top:-1px}
.ticon{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.75);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer}
.greet{font-size:16px;color:#4a4d60;font-weight:500}
.greet b{font-weight:800;color:var(--ink)}
.planrow{display:flex;align-items:baseline;justify-content:space-between;margin-top:12px}
.planrow h2{font-size:19px;font-weight:800;margin:0;letter-spacing:-.3px}
.planrow a{font-size:12px;color:var(--dim);font-weight:700;cursor:pointer}
.segbar{display:flex;gap:5px;margin-top:11px}
.segbar i{flex:1;height:5px;border-radius:6px;background:#e6e4ec;transition:background .35s}
.segbar i.on{background:var(--ok)}

/* ---- task rows ---- */
.tasks{margin-top:-10px;padding:0 16px}
.task{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:16px;padding:15px 14px;
  margin-bottom:9px;box-shadow:var(--sh);cursor:pointer;transition:.15s}
.task:active{transform:scale(.985)}
.tico{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0;color:#fff}
.tbody{flex:1;min-width:0}
.tbody b{display:block;font-size:15px;font-weight:800;letter-spacing:-.2px}
.tbody span{display:block;font-size:12.5px;color:var(--dim);font-weight:600;margin-top:2px}
.tarrow{color:#c6c4d0;font-size:18px;font-weight:700}
.task.done{border:1.5px solid #cdeedd}
.task.done .tarrow{color:var(--ok)}

/* ---- generic ---- */
.sect{font-size:17px;font-weight:800;letter-spacing:-.3px;margin:20px 0 10px}
.card{background:var(--card);border-radius:18px;padding:15px;margin-bottom:10px;box-shadow:var(--sh)}
.note{font-size:12px;color:var(--dim);line-height:1.6;font-weight:500}
.pagehd{display:flex;align-items:center;gap:12px;padding:16px 16px 12px}
.back{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:17px;
  cursor:pointer;flex-shrink:0;color:var(--ink);font-family:inherit}
.pagehd h2{flex:1;font-size:16px;font-weight:800;margin:0;letter-spacing:-.2px}
.pagehd .sm{font-size:11px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.6px;display:block;margin-top:1px}
input,textarea,select{background:#fafafc;border:1.5px solid var(--line);color:var(--ink);border-radius:12px;
  padding:11px;font-size:15px;width:100%;font-family:inherit;font-weight:600}
input::placeholder,textarea::placeholder{color:#b9b8c4;font-weight:500}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--rose)}
.btn{width:100%;padding:14px;border-radius:16px;border:none;background:var(--navy);color:#fff;font-size:14px;
  font-weight:800;cursor:pointer;font-family:inherit}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.rose{background:var(--rose)}
.vidbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:15px;
  background:var(--rose-l);color:var(--rose-d);font-size:13.5px;font-weight:800;text-decoration:none;border:1px solid var(--rose-b)}
.status{font-size:11px;color:var(--ok);height:14px;font-weight:700;padding:0 16px}

/* ---- tabs (Opzione 1/2/3 · Metriche/Foto) ---- */
.tabs{display:flex;gap:18px;border-bottom:1.5px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:none;background:none;padding:9px 0;font-size:13.5px;font-weight:700;color:var(--dim);
  cursor:pointer;font-family:inherit;white-space:nowrap;border-bottom:2.5px solid transparent;margin-bottom:-1.5px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--navy)}

/* ---- exercise detail ---- */
.exhero{background:linear-gradient(150deg,#f6dbe6,#efe6f7);height:150px;border-radius:18px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:9px;margin-bottom:14px}
.exhero .play{width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;
  justify-content:center;font-size:19px;box-shadow:var(--sh)}
.exhero span{font-size:12px;font-weight:700;color:var(--rose-d)}
.histbadge{background:var(--rose-l);border:1px solid var(--rose-b);color:var(--rose-d);font-size:12px;
  font-weight:700;padding:9px 12px;border-radius:12px;margin-bottom:12px;text-align:center}
.setline .fld label u{color:var(--rose-d);text-decoration:none;font-weight:800}
details.instr{border:1.5px solid var(--line);border-radius:15px;padding:13px;margin-bottom:14px;background:#fff}
details.instr summary{font-size:13.5px;font-weight:800;cursor:pointer;list-style:none;display:flex;align-items:center}
details.instr summary::-webkit-details-marker{display:none}
details.instr summary::after{content:'⌄';margin-left:auto;font-size:16px;color:var(--dim)}
details.instr[open] summary::after{content:'⌃'}
.cues{margin:11px 0 0;padding:0;list-style:none}
.cues li{font-size:13px;color:#4a4d60;line-height:1.5;font-weight:600;padding:6px 0 6px 17px;position:relative}
.cues li::before{content:'';position:absolute;left:0;top:12px;width:6px;height:6px;border-radius:50%;background:var(--rose-b)}
.setline{display:flex;align-items:flex-end;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.setline .no{font-size:15px;font-weight:800;color:var(--dim);width:22px;flex-shrink:0;padding-bottom:10px}
.setline .fld{flex:1;min-width:0}
.setline .fld label{display:block;font-size:10.5px;color:var(--dim);font-weight:700;margin-bottom:4px}
.chk{width:40px;height:40px;border-radius:50%;border:2px solid #dfdde7;background:#fff;color:#dfdde7;
  font-size:17px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.exnav{display:flex;gap:10px;margin-top:16px}
.exnav button{flex:1;padding:14px;border-radius:26px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit}
.exnav .prev{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.exnav .next{background:var(--navy);border:none;color:#fff}

/* ---- exercise list ---- */
.exrow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:15px;padding:13px;
  margin-bottom:8px;box-shadow:var(--sh);cursor:pointer}
.exrow .num{width:28px;height:28px;border-radius:9px;background:var(--rose-l);color:var(--rose-d);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;flex-shrink:0}
.exrow .num.done{background:var(--ok);color:#fff}
.exrow .info{flex:1;min-width:0}
.exrow .info b{display:block;font-size:14px;font-weight:800;letter-spacing:-.2px}
.exrow .info span{font-size:11.5px;color:var(--dim);font-weight:600}

/* ---- food rows ---- */
.food{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.food:last-child{border:none}
.food .fi{flex:1;min-width:0}
.food .fi b{display:block;font-size:14px;font-weight:700;letter-spacing:-.1px}
.food .fi span{font-size:12px;color:var(--dim);font-weight:600;margin-top:2px;display:block}
.fitem{padding:12px 0;border-bottom:1px solid var(--line)}
.fitem:last-of-type{border:none}
.frow1{display:flex;gap:7px;margin-bottom:8px}
.frow1 select,.frow1 input{flex:1;min-width:0}
.fback{border:1.5px solid var(--line);background:#fff;border-radius:12px;width:46px;flex:none;font-size:15px;
  cursor:pointer;color:var(--dim);font-family:inherit;font-weight:800}
.frow2{display:grid;grid-template-columns:1fr 1fr 1fr 34px;gap:7px;align-items:end}
.frow2 label{font-size:10px;font-weight:700;color:var(--dim);display:block;margin-bottom:4px}
.frow2 .x{background:none;border:none;color:#e08aa8;font-size:22px;cursor:pointer;padding:0;height:44px;font-weight:700}
.fhint{font-size:10.5px;color:var(--rose-d);font-weight:700;margin-top:7px}
.addbtn{width:100%;padding:12px;border-radius:15px;border:2px dashed var(--line);background:none;color:var(--dim);
  font-size:13px;cursor:pointer;margin-top:6px;font-weight:800;font-family:inherit}
.mealhdr{font-size:16px;font-weight:800;margin:18px 0 9px;letter-spacing:-.3px}
.subkc{font-size:12px;color:var(--dim);font-weight:600}

/* ---- water ---- */
.water-card{background:#fffdf8;border:1px solid #d9e6df;border-radius:20px;padding:15px;box-shadow:var(--sh)}
.water-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.water-head b{font-size:15px;color:#285744}.water-total{font-size:12px;font-weight:900;color:#285744}.water-controls{display:flex;align-items:center;gap:8px;margin-top:11px}.water-btn{width:38px;height:38px;border:1px solid #c7dfd1;border-radius:12px;background:#e8f4ed;color:#285744;font-size:20px;font-weight:900;cursor:pointer}.water-btn:active{transform:scale(.96)}.water-note{font-size:10.5px;color:var(--dim);font-weight:700;margin-top:7px}
.glasses{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.glasses .gl{flex:1;min-width:26px;aspect-ratio:1;border-radius:12px;border:1.5px solid var(--line);
  background:#fafafc;color:#cfcdd8;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.glasses .gl.full{background:linear-gradient(160deg,#bfe0f5,#69b3e0);border-color:#69b3e0;color:#fff}

/* ---- evolution ---- */
.ring{width:96px;height:96px;flex-shrink:0}
.metric{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.metric:last-child{border:none}
.metric span{color:var(--dim);font-weight:600}
.metric b{font-weight:800}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid label{font-size:11px;color:var(--dim);font-weight:700;display:block;margin-bottom:5px}

/* ---- agenda ---- */
.agrow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:15px;padding:13px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer}
.agrow.today{border:1.5px solid var(--rose-b);background:var(--rose-l)}
.agrow .d{width:44px;text-align:center;flex-shrink:0}
.agrow .d u{display:block;font-size:10px;color:var(--dim);text-decoration:none;font-weight:700;text-transform:uppercase}
.agrow .d b{display:block;font-size:18px;font-weight:800}
.agrow .info{flex:1}
.agrow .info b{display:block;font-size:14px;font-weight:800}
.agrow .info span{font-size:11.5px;color:var(--dim);font-weight:600}

/* ---- bottom nav ---- */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:660px;background:#fff;
  border-top:1px solid var(--line);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:60}
.nav button{flex:1;border:none;background:none;color:#a7a6b4;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;font-weight:700;padding:4px 2px}
.nav button i{font-style:normal;font-size:18px;line-height:1}
.nav button.on{color:var(--rose)}



/* ---- coach / personalised profile ---- */
.coachmsg{display:flex;gap:9px;margin:9px 0}.coachmsg .bubble{padding:11px 13px;border-radius:15px;max-width:88%;font-size:13px;line-height:1.45;font-weight:600}.coachmsg.bot .bubble{background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}.coachmsg.user{justify-content:flex-end}.coachmsg.user .bubble{background:var(--rose-l);color:#4a3040}.coachinput{display:flex;gap:8px;position:sticky;bottom:72px;background:var(--bg);padding:8px 0;z-index:10}.coachinput input{flex:1}.choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;text-align:left;font:700 12px inherit;cursor:pointer}.choice:hover{border-color:var(--rose-b)}.profilecard{background:linear-gradient(135deg,#fff,#fff5f8);border:1px solid var(--rose-b)}.pill{display:inline-block;background:var(--rose-l);color:#8f3c5d;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;margin:3px}.planbadge{font-size:11px;color:var(--dim);font-weight:700;margin-top:4px}
/* ---- floating mini coach ---- */
.minicoach-fab{position:fixed;right:max(16px,calc(50% - 330px + 16px));bottom:88px;width:58px;height:58px;border-radius:50%;border:3px solid #fff;background:linear-gradient(145deg,#f7d8e5,#dba1bd);box-shadow:0 8px 24px rgba(30,35,64,.22);z-index:90;display:flex;align-items:center;justify-content:center;font-size:27px;cursor:pointer;transition:transform .15s}.minicoach-fab:active{transform:scale(.94)}
.minicoach-panel{position:fixed;right:max(12px,calc(50% - 330px + 12px));bottom:154px;width:min(360px,calc(100vw - 24px));max-height:min(560px,calc(100vh - 190px));background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 16px 44px rgba(30,35,64,.24);z-index:95;display:flex;flex-direction:column;overflow:hidden}.minicoach-head{display:flex;align-items:center;gap:10px;padding:13px 14px;background:linear-gradient(135deg,#fff5f8,#f8f4fb);border-bottom:1px solid var(--line)}.minicoach-avatar{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--rose-b)}.minicoach-head b{font-size:13px}.minicoach-head span{display:block;font-size:10.5px;color:var(--dim);font-weight:600;margin-top:1px}.minicoach-close{margin-left:auto;width:30px;height:30px;border:0;background:transparent;font-size:20px;color:var(--dim);cursor:pointer}.minicoach-body{padding:12px;overflow:auto}.minimsg{display:flex;margin:7px 0}.minimsg.user{justify-content:flex-end}.minibubble{max-width:88%;padding:10px 12px;border-radius:15px;background:#f8f7fa;border:1px solid var(--line);font-size:12.5px;line-height:1.48;font-weight:600}.minimsg.user .minibubble{background:var(--rose-l);border-color:var(--rose-b);color:#4a3040}.mini-video{display:block;margin-top:9px;padding:10px 12px;border-radius:12px;background:var(--rose-l);color:var(--rose-d);text-decoration:none;font-size:12px;font-weight:800}.mini-cues{margin:9px 0 0;padding-left:18px;font-size:11.5px;line-height:1.55;color:var(--dim);font-weight:600}.mini-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 9px}.mini-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 9px;font:700 10.5px inherit;color:var(--ink);cursor:pointer}.minicoach-input{display:flex;gap:7px;padding:10px;border-top:1px solid var(--line);background:#fff}.minicoach-input input{padding:10px 11px;font-size:13px}.minicoach-input button{width:44px;border:0;border-radius:13px;background:var(--navy);color:#fff;font-weight:800;cursor:pointer}.mini-hint{font-size:10.5px;color:var(--dim);font-weight:600;padding:0 12px 8px}

/* ---- visual refresh: layout only ---- */
html{background:#f5f3f8}
body{background:linear-gradient(180deg,#f7f5fa 0%,#fbfbfc 42%,#f4f3f8 100%);color:var(--ink)}
#app{background:transparent;max-width:700px;padding-bottom:104px}
.wrap{padding:0 18px}
.top{position:relative;overflow:hidden;padding:20px 18px 24px;border-radius:0 0 30px 30px;
  box-shadow:0 10px 28px -18px rgba(30,35,64,.4)}
.top:after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;right:-70px;bottom:-92px;
  background:rgba(255,255,255,.38);pointer-events:none}
.toprow{position:relative;z-index:1;margin-bottom:20px}
.ava{width:44px;height:44px;box-shadow:0 6px 14px rgba(169,63,102,.22)}
.logo{font-size:24px;letter-spacing:5.5px}
.ticon{box-shadow:0 4px 12px rgba(30,35,64,.07)}
.greet{font-size:15px;letter-spacing:-.1px}
.planrow{margin-top:15px}
.planrow h2{font-size:20px}
.segbar{gap:6px;margin-top:13px}
.segbar i{height:6px;background:#e3e1ea;box-shadow:inset 0 1px 1px rgba(30,35,64,.04)}
.tasks{margin-top:-5px;padding:0 18px}
.task{gap:14px;border:1px solid rgba(255,255,255,.8);border-radius:18px;padding:16px 15px;margin-bottom:10px;
  box-shadow:0 8px 22px -14px rgba(30,35,64,.36)}
.task:hover{transform:translateY(-1px);box-shadow:0 11px 24px -14px rgba(30,35,64,.42)}
.task.done{border:1.5px solid #bfe8d2;background:linear-gradient(90deg,#fff,#fbfffd)}
.tico{width:40px;height:40px;box-shadow:0 5px 12px rgba(30,35,64,.12)}
.tbody b{font-size:15px}
.tbody span{font-size:12px}
.sect{font-size:18px;margin:24px 0 11px;letter-spacing:-.5px}
.card{border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:17px;margin-bottom:12px;
  box-shadow:0 8px 22px -15px rgba(30,35,64,.33)}
.pagehd{padding:18px 18px 13px}
.pagehd h2{font-size:17px}
.back{box-shadow:0 4px 12px rgba(30,35,64,.06)}
input,textarea,select{background:#fff;border-color:#e7e4ed;box-shadow:inset 0 1px 2px rgba(30,35,64,.025)}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 4px rgba(201,85,127,.11)}
.btn{box-shadow:0 8px 14px -10px rgba(30,35,64,.7)}
.btn.rose{box-shadow:0 8px 14px -10px rgba(169,63,102,.75)}
.tabs{gap:22px}
.tabs button{padding:10px 0}
.exhero{height:170px;border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.exhero .play{width:58px;height:58px;box-shadow:0 8px 18px -10px rgba(30,35,64,.5)}
.histbadge{box-shadow:0 6px 16px -12px rgba(169,63,102,.7)}
.exrow,.agrow{border:1px solid rgba(255,255,255,.8);box-shadow:0 7px 18px -14px rgba(30,35,64,.4)}
.exrow:hover,.agrow:hover{transform:translateY(-1px)}
.exrow .num{box-shadow:inset 0 0 0 1px rgba(201,85,127,.08)}
.nav{max-width:700px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(236,234,241,.95);box-shadow:0 -8px 24px -20px rgba(30,35,64,.5);padding-top:10px}
.nav button{padding:5px 2px}
.nav button.on{font-weight:800}
details.instr{box-shadow:0 6px 14px -13px rgba(30,35,64,.3)}
.profilecard{box-shadow:0 8px 18px -13px rgba(169,63,102,.35)}

/* ---- editorial wellness polish: visual-only override ---- */

/* ================= MOTION · P0 =================
   Subtle, fast, premium. Only transform/opacity are animated.
   Inputs, timer digits, calendar, lists and data screens are deliberately NOT animated. */
:root{--ease-out:cubic-bezier(.2,.8,.2,1);--ease-pop:cubic-bezier(.34,1.4,.64,1);--d-press:90ms;--d-fast:160ms;--d-base:220ms;--d-slow:320ms}

/* Press feedback: buttons, tabs, chips and tappable cards */
[data-go],.btn,.exnav button,.diet-check,.mini-chip,.gl,.tabs button,.exercise-tabs-v5 button,.diet-section-tabs button,.nutri-daybar button{transition:transform var(--d-press) var(--ease-out),opacity var(--d-press) var(--ease-out)}
[data-go]:active{transform:scale(.98);opacity:.92}
.btn:active:not(:disabled),.exnav button:active:not(:disabled),.mini-chip:active,.gl:active{transform:scale(.97);opacity:.9}
.diet-check:active{transform:scale(.92)}
.tabs button:active,.exercise-tabs-v5 button:active,.diet-section-tabs button:active,.nutri-daybar button:active{transform:scale(.96);opacity:.85}

/* Set completion (.chk): colour change + press, and a one-shot checkmark pop when a set is ticked.
   .chk-pop is added only by a real tap, so re-renders never replay it. */
.chk{transition:background-color var(--d-fast) var(--ease-out),border-color var(--d-fast) var(--ease-out),color var(--d-fast) var(--ease-out),transform var(--d-press) var(--ease-out)}
.chk:active{transform:scale(.9)}
.chk.chk-pop{animation:fedeChkPop 260ms var(--ease-pop)}
@keyframes fedeChkPop{0%{transform:scale(.78)}100%{transform:scale(1)}}

/* Screen entry: only when the screen actually changes (#page[data-enter] is set by render()). */
#page[data-enter]>*{animation:fedeScreenIn var(--d-base) var(--ease-out) var(--enter-delay,0ms) both}
@keyframes fedeScreenIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Reduced motion: no movement; state changes stay instant and fully visible. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  #page[data-enter]>*,.chk.chk-pop{animation:none!important}
  [data-go]:active,.btn:active,.exnav button:active,.mini-chip:active,.gl:active,.diet-check:active,.chk:active,.tabs button:active,.exercise-tabs-v5 button:active,.diet-section-tabs button:active,.nutri-daybar button:active,.task:active,.water-btn:active,.minicoach-fab:active,.mini-action:active{transform:none!important}
}

/* ================= MOTION · P1 / TOUCH / A11Y =================
   Gated or one-shot only (never replays on same-screen re-renders). transform/opacity only. */
/* Progress bars fill once when the screen is entered */
#page[data-enter] .workout-progress-bar i{transform-origin:left center;animation:fedeBarGrow var(--d-slow) var(--ease-out) both}
@keyframes fedeBarGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* Coach panel opens from its button (only on the closed -> open transition) */
.minicoach-panel.mc-enter{transform-origin:100% 100%;animation:fedePanelIn var(--d-base) var(--ease-out) both}
@keyframes fedePanelIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
/* Update banner slides in once */
#swupdate{animation:fedeBannerIn var(--d-base) var(--ease-out) both}
@keyframes fedeBannerIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
/* Press feedback for tappable rows, Lab cards and the bottom nav */
.exrow-v5[data-ex]:active,.lab-ex-card:active{transform:scale(.985)}
.lab-ex-card{transition:transform var(--d-press) var(--ease-out)}
.nav button{transition:transform var(--d-press) var(--ease-out)}
.nav button:active{transform:scale(.92)}
/* Exercise media: low-resolution photos are shown at a modest size instead of being stretched */
.exercise-media .local-player-poster{display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#e8f4ed,#ead9cc)}
.exercise-media .local-player-poster img{width:auto!important;height:auto!important;min-height:0!important;max-height:210px;max-width:72%;object-fit:contain;border-radius:16px;box-shadow:0 10px 24px -14px rgba(24,43,59,.5)}
.video-placeholder-detail.media-photo .media-photo-img{display:block;max-height:180px;max-width:68%;object-fit:contain;border-radius:16px;box-shadow:0 10px 24px -14px rgba(24,43,59,.5)}
/* Touch: no double-tap zoom delay or text selection on controls; larger hit areas without layout change */
button,a,[data-go],[data-ex],[data-lab-ex],.chk,.nav button{touch-action:manipulation}
button,.nav,.chk,[data-ex],[data-lab-ex],[data-go]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.back,.ticon,.diet-check,.glasses .gl,.water-btn,.minicoach-close{position:relative}
.back::after,.ticon::after,.diet-check::after,.glasses .gl::after,.water-btn::after,.minicoach-close::after{content:'';position:absolute;inset:-7px}
/* Keyboard focus visible (does not appear on touch) */
:focus-visible{outline:2px solid #285744;outline-offset:2px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline-offset:0}
/* Reduced motion: none of the above moves */
@media (prefers-reduced-motion: reduce){
  #page[data-enter] .workout-progress-bar i,.minicoach-panel.mc-enter,#swupdate{animation:none!important}
  .exrow-v5[data-ex]:active,.lab-ex-card:active,.nav button:active{transform:none!important}
}
</style>

function slugExercise(s){
  return String(s||'').toLowerCase().replace(/·/g,' ').replace(/\//g,'-').replace(/[^a-z0-9àèéìòù]+/g,'-').replace(/^-+|-+$/g,'');
}
function musclesForExercise(name){
  if(MUSCLE_DB[name]) return MUSCLE_DB[name];
  const n=String(name||'').toLowerCase();
  if(/glute|hip thrust|abduction|clamshell|kickback/.test(n)) return ["Glutei"];
  if(/curl|biceps/.test(n)) return ["Bicipiti"];
  if(/triceps|dip/.test(n)) return ["Tricipiti"];
  if(/row|pulldown|pull-up/.test(n)) return ["Gran dorsale","Romboidi"];
  if(/chest|press/.test(n)) return ["Pettorali","Deltoidi","Tricipiti"];
  if(/lateral|shoulder|pec deck/.test(n)) return ["Deltoidi"];
  if(/leg press|split squat|quad/.test(n)) return ["Quadricipiti","Glutei"];
  if(/leg curl|rdl|stacco|extension/.test(n)) return ["Femorali","Glutei"];
  if(/calf/.test(n)) return ["Polpacci"];
  if(/l-sit|frog|dead bug|knee raise|vacuum|crunch/.test(n)) return ["Core"];
  return ["Muscoli coinvolti nel movimento"];
}

async function labStrengthHist(id){

  for(let i=0;i<dates.length;i++){
    const ds=dates[i], d=new Date(ds+'T12:00:00'), v=(ds===todayStr)?data:await get(d);
    if(!v)continue;

    for(let s=1;s<=(+e[2]||3);s++){
      const recs=[getSetValue(v,LAB_CALISTHENICS_DAY,idx,e,s)];

// Keeps a record's exercise map (dayEx names + dayExIds, index-aligned) in step with the plan WITHOUT
// rewriting history: a record with no map gets the current list; a record with a map only gains
// exercises it lacks, appended at the end (existing positions, used by legacy positional keys,
// never change); a legacy record with names but no IDs is left untouched.
function syncRecordExerciseMap(rec,day){
  const p=dayPlan(day);
  if(!rec||!p||!Array.isArray(p.ex))return;
  const names=p.ex.map(function(e){return e[0];}), ids=p.ex.map(function(e,i){return exerciseId(day,i,e);});
  const hasNames=Array.isArray(rec.dayEx)&&rec.dayEx.length, hasIds=Array.isArray(rec.dayExIds)&&rec.dayExIds.length;
  if(!hasNames&&!hasIds){rec.dayEx=names;rec.dayExIds=ids;return;}
  if(!hasIds||!hasNames||rec.dayEx.length!==rec.dayExIds.length)return;
  const known={}; rec.dayExIds.forEach(function(id){known[canonicalExerciseId(id)]=1;});
  ids.forEach(function(id,i){if(!known[canonicalExerciseId(id)]){rec.dayExIds.push(id);rec.dayEx.push(names[i]);known[canonicalExerciseId(id)]=1;}});

// saveDirty: there are in-memory changes to `data`/`goals` not yet written to localStorage.
let saveDirty=false;
function save(){saveDirty=true;clearTimeout(saveT);saveT=setTimeout(doSave,400);}
function saveGoals(){goalsDirty=true;save();}
// Writes pending changes IMMEDIATELY (synchronously) and cancels the debounce timer, so the same
// change is never written twice. Used before switching date (load), on pagehide / page hidden /
// beforeunload, and before a Service Worker update reload. Returns true if nothing is left unsaved.
function flushSave(){

  if(!saveDirty)return true;

}
async function doSave(){return doSaveNow();}
function doSaveNow(){
  if(!data||!key){saveDirty=false;return true;}

    syncRecordExerciseMap(data,data.day);

    localStorage.setItem(key,JSON.stringify(data));
    if(goalsDirty){localStorage.setItem("fede:goals",JSON.stringify(goals));goalsDirty=false;}
    saveDirty=false;
    if(s){s.style.color="var(--ok)";s.textContent="✓ salvato";setTimeout(function(){if(s&&s.textContent==="✓ salvato")s.textContent="";},1500);}
    return true;
  }catch(e){
    const msg=(e&&e.message)||"errore salvataggio";
    if(s){s.style.color="#c9557f";
      s.textContent=/rate limit/i.test(msg)?"⏳ troppi salvataggi, riprovo tra poco…":"⚠ "+msg;}
    // ritenta una volta sola dopo una pausa
    clearTimeout(saveT);saveT=setTimeout(doSave,6000);

  }finally{

  }
}
async function loadLastSession(day,exIdx,exName){

    const todayStr=k(cur);

    if(dates===null){

        dates.push(k(d));
      }
    }else{
      dates=dates.filter(function(ds){return ds<todayStr;});
    }
    for(let i=0;i<dates.length && i<60;i++){
      const d=new Date(dates[i]+'T12:00:00');
      let v=null;
      try{v=await get(d);}catch(err){v=null;}
      if(!v||!v.day)continue;
      // cerca per NOME esercizio usando l'istantanea salvata in quella sessione (dayEx):
      // è l'unico modo affidabile di sapere cosa c'era in ogni posizione quando fu salvata.
      // Se la sessione è troppo vecchia e non ha dayEx, si prova con la struttura attuale
      // come ultima spiaggia (funziona solo se la scheda non è stata riordinata nel frattempo).
      // Lab: same permanent ID in the Lab namespace of each record (never the main-day exercise of that name).
      const srcIdxs=lab?[exIdx]:findHistoricalIndices(v,day,exIdx,e[0]);
      if(!srcIdxs.length)continue;
      const found={};
      let any=false;
      const nSets=e[2];
      const unilateral=isUnilateralExercise(e);
      for(let s=1;s<=nSets;s++){
        for(let ii=0;ii<srcIdxs.length;ii++){
          const srcIdx=srcIdxs[ii];
          const oldPlan=(planForUser()[v.day]&&planForUser()[v.day].ex)||[];
          const oldEx=lab?e:historicalExercise(v,srcIdx,e,day), rday=lab?day:v.day;
          if(unilateral){
            let sideFound=false;
            ['right','left'].forEach(function(side){const rec=getSideSetValue(v,rday,srcIdx,oldEx,s,side);if(rec&&(rec.r||rec.sec)){found[s+'-'+side]=rec;any=true;sideFound=true;}});
            // Same exercise logged before right/left tracking existed: show it as a bilateral set.
            if(!sideFound&&!found[s]){const rec=getSetValue(v,rday,srcIdx,oldEx,s);if(rec&&(rec.r||rec.sec)){found[s]=rec;any=true;}}
          }else{

            if(rec&&(rec.r||rec.sec)){found[s]=rec;any=true;break;}
          }

  }finally{

  }
}

  const p=dayPlan(data.day), e=p&&p.ex&&p.ex[exIdx], s=+parts[2];

    return getSideSetValue(data,data.day,exIdx,e,s,side);

function repRangeForExercise(desc){

function lastValidSessionForTarget(rr){

}
function nextTargetForExercise(e,timed){

  if(!valid.length)return null;
  const allAtMax=valid.length>=rr.sets && valid.every(function(x){return x.r>=rr.max;});
  const maxKg=Math.max.apply(null,valid.map(function(x){return x.kg;}));

  const reps=valid.map(function(x){return x.r;});
  const target=Math.min(rr.max,Math.max(rr.min,Math.round((Math.min.apply(null,reps)+Math.max.apply(null,reps))/2)+1));
  if(timed)return{main:(maxKg?maxKg+' kg · ':'')+target+' sec × '+rr.sets,sub:'Prova ad aggiungere 1–2 secondi mantenendo una posizione pulita.'};
  return{main:(maxKg?maxKg+' kg · ':'')+target+' reps × '+rr.sets,sub:'Prova ad aggiungere 1 ripetizione mantenendo RIR e tecnica previsti.'};

  if(/shoulder|lateral|press|curl|triceps|dip/.test(n))return 'Spalle & braccia';
  if(/l-sit|frog|vacuum|dead bug|plank|knee raise/.test(n))return 'Core & skill';
  return 'Full body';

  try{for(let i=0;i<localStorage.length;i++){const k2=localStorage.key(i);if(k2&&k2.indexOf('fede:')===0)backup.localStorage[k2]=localStorage.getItem(k2);}}catch(e){}

/* ---------- Safe import: validate -> preview -> snapshot -> merge (never blind overwrite) ---------- */
// Device-local state that is never imported from a backup.
const IMPORT_SKIP_KEYS=new Set(['fede:planVersion','fede:scheduleVersion','fede:schemaVersion','fede:bundledBackupRestored','fede:historyNameMigrationV4','fede:lang','fede:userPlanMeta']);
function importIsSkippedKey(k){return IMPORT_SKIP_KEYS.has(k)||k.indexOf('fede:autobackup:')===0;}
function importIsEmpty(v){
  if(v==null||v===''||v===0)return true;
  if(Array.isArray(v))return v.length===0;
  if(typeof v==='object')return Object.keys(v).every(function(x){return v[x]===''||v[x]==null;});
  return false;
}
function importClone(v){return v===undefined?undefined:JSON.parse(JSON.stringify(v));}
// Field-level merge of one day record. Local values win on conflict unless BOTH records carry
// _updatedAt and the incoming one is newer. Unknown fields are preserved. Returns {record, conflict}.
function mergeDayRecord(L,I){
  const out=importClone(L)||{}, inc=I||{};
  const incomingNewer=!!(out._updatedAt&&inc._updatedAt&&String(inc._updatedAt)>String(out._updatedAt));
  let conflict=false;
  const pick=function(lv,iv){ // returns [value, conflicted]
    if(iv===undefined)return [lv,false];
    if(JSON.stringify(lv)===JSON.stringify(iv))return [lv,false];
    if(lv===undefined||importIsEmpty(lv)&&!importIsEmpty(iv))return [importClone(iv),false];
    if(importIsEmpty(iv))return [lv,false];
    return [incomingNewer?importClone(iv):lv,true];
  };
  ['sets','done','warm'].forEach(function(f){
    const lm=(out[f]&&typeof out[f]==='object')?out[f]:{}, im=(inc[f]&&typeof inc[f]==='object')?inc[f]:{};
    Object.keys(im).forEach(function(k2){const r=pick(lm[k2],im[k2]);lm[k2]=r[0];if(r[1])conflict=true;});
    out[f]=lm;
  });
  const localHasWork=Object.keys(L&&L.sets||{}).length+Object.keys(L&&L.done||{}).length>0;
  if(inc.day!==undefined&&!localHasWork&&Object.keys(inc.sets||{}).length+Object.keys(inc.done||{}).length>0)out.day=inc.day;
  else if(inc.day!==undefined&&out.day!==inc.day&&localHasWork){conflict=true;if(incomingNewer)out.day=inc.day;}
  ['note','weight','water'].forEach(function(f){const r=pick(out[f],inc[f]);out[f]=r[0];if(r[1])conflict=true;});
  if(inc.meas&&typeof inc.meas==='object'){out.meas=out.meas&&typeof out.meas==='object'?out.meas:{};Object.keys(inc.meas).forEach(function(f){const r=pick(out.meas[f],inc.meas[f]);out.meas[f]=r[0];if(r[1])conflict=true;});}
  if(inc.food&&typeof inc.food==='object'){out.food=out.food&&typeof out.food==='object'?out.food:{};Object.keys(inc.food).forEach(function(m){const r=pick(out.food[m],inc.food[m]);out.food[m]=r[0];if(r[1])conflict=true;});}
  const noMap=function(x){return !(Array.isArray(x.dayEx)&&x.dayEx.length)&&!(Array.isArray(x.dayExIds)&&x.dayExIds.length);};
  if(noMap(out)&&!noMap(inc)){out.dayEx=importClone(inc.dayEx)||[];out.dayExIds=importClone(inc.dayExIds)||[];}
  Object.keys(inc).forEach(function(f){if(!(f in out))out[f]=importClone(inc[f]);}); // unknown fields preserved
  if(inc._updatedAt&&(!out._updatedAt||String(inc._updatedAt)>String(out._updatedAt)))out._updatedAt=inc._updatedAt;
  return {record:out,conflict:conflict};
}
function parseBackupText(txt){
  let b=null;
  try{b=JSON.parse(String(txt||''));}catch(e){return {ok:false,error:'Il testo non è un JSON valido.'};}
  if(!b||typeof b!=='object'||Array.isArray(b))return {ok:false,error:'Formato backup non riconosciuto.'};
  if(b.format!==undefined&&b.format!=='fede-training-complete')return {ok:false,error:'Formato backup diverso da "fede-training-complete".'};
  const hasLS=b.localStorage&&typeof b.localStorage==='object'&&!Array.isArray(b.localStorage);
  if(!hasLS&&!b.profile&&!b.userPlan&&!b.goals)return {ok:false,error:'Il backup non contiene dati Fede Training.'};
  return {ok:true,backup:b};
}
// READ-ONLY analysis: what an import would do. Nothing is written.
function analyzeBackup(b){
  const items={}, warnings=[], res={add:[],identical:[],merge:[],conflict:[],skip:[],invalid:[],planStatus:'none',exportedAt:b.exportedAt||null,version:b.version||null,items:items,warnings:warnings};
  const src=Object.assign({},(b.localStorage&&typeof b.localStorage==='object')?b.localStorage:{});
  // Top-level copies are only used when the localStorage section lacks them.
  if(b.profile&&src['fede:profile']===undefined)src['fede:profile']=JSON.stringify(b.profile);
  if(b.userPlan&&src['fede:userPlan']===undefined)src['fede:userPlan']=JSON.stringify(b.userPlan);
  if(b.goals&&src['fede:goals']===undefined)src['fede:goals']=JSON.stringify(b.goals);
  Object.keys(src).forEach(function(k2){
    const v=src[k2];
    if(k2.indexOf('fede:')!==0){res.skip.push(k2);return;}
    if(importIsSkippedKey(k2)){res.skip.push(k2);return;}
    if(typeof v!=='string'){res.invalid.push(k2);warnings.push(k2+': valore non testuale ignorato');return;}
    const isDay=/^fede:\d{4}-\d{2}-\d{2}$/.test(k2);
    let inc=null;
    if(isDay){try{inc=JSON.parse(v);}catch(e){inc=null;}if(!inc||typeof inc!=='object'||Array.isArray(inc)){res.invalid.push(k2);warnings.push(k2+': giornata non valida ignorata');return;}}
    const local=localStorage.getItem(k2);
    if(k2==='fede:userPlan'){
      let p=null;try{p=JSON.parse(v);}catch(e){p=null;}
      if(!isValidPlan(p)){res.invalid.push(k2);warnings.push('Piano nel backup non valido: ignorato');return;}
      if(local==null){res.add.push(k2);items[k2]={action:'add',value:v};res.planStatus='new';}
      else if(local===v){res.identical.push(k2);res.planStatus='identical';}
      else{res.conflict.push(k2);items[k2]={action:'keep-local',value:v};res.planStatus='different';}
      return;
    }
    if(local==null){res.add.push(k2);items[k2]={action:'add',value:v};return;}
    if(local===v){res.identical.push(k2);return;}
    if(isDay){
      let L=null;try{L=JSON.parse(local);}catch(e){L=null;}
      if(!L||typeof L!=='object'){res.conflict.push(k2);items[k2]={action:'keep-local',value:v};return;}
      const m=mergeDayRecord(L,inc), merged=JSON.stringify(m.record);
      if(merged===local&&!m.conflict){res.identical.push(k2);return;}
      (m.conflict?res.conflict:res.merge).push(k2);
      items[k2]={action:'merge',value:merged,incoming:v,local:local,conflict:m.conflict};
      return;
    }
    if(k2.indexOf('fede:exnote:')===0&&local===''){res.merge.push(k2);items[k2]={action:'fill-empty',value:v};return;}
    res.conflict.push(k2);items[k2]={action:'keep-local',value:v};
  });
  return res;
}
// Applies an analysis. ALWAYS takes a verified snapshot first (aborts if impossible). Never deletes.
// Conflicting values that are not written are stashed in fede:importconflict:<timestamp>.
function applyBackupImport(res,opts){
  opts=opts||{};
  flushSave();
  const snapshotKey=createSafetySnapshot('pre-import');
  if(!snapshotKey)return {ok:false,error:'Impossibile creare la copia di sicurezza: importazione annullata, nessun dato modificato.'};
  const stash={createdAt:new Date().toISOString(),sourceExportedAt:res.exportedAt||null,snapshot:snapshotKey,keptLocal_incomingValue:{},replacedLocal_previousValue:{}};
  let written=0;
  Object.keys(res.items).forEach(function(k2){
    const it=res.items[k2];
    if(k2==='fede:userPlan'&&it.action==='keep-local'){
      if(opts.replacePlan){let p=null;try{p=JSON.parse(it.value);}catch(e){p=null;}
        if(isValidPlan(p)){replaceUserPlanSafely(p,'import-replace-plan',{customized:true});written++;return;}}
      stash.keptLocal_incomingValue[k2]=it.value;return;
    }
    if(it.action==='keep-local'){stash.keptLocal_incomingValue[k2]=it.value;return;}
    if(it.action==='merge'){
      if(it.conflict){stash.keptLocal_incomingValue[k2]=it.incoming;stash.replacedLocal_previousValue[k2]=it.local;}
      localStorage.setItem(k2,it.value);written++;return;
    }
    if(it.action==='add'||it.action==='fill-empty'){localStorage.setItem(k2,it.value);written++;}
  });
  let stashKey=null;
  if(Object.keys(stash.keptLocal_incomingValue).length||Object.keys(stash.replacedLocal_previousValue).length){
    stashKey='fede:importconflict:'+safetyStamp();localStorage.setItem(stashKey,JSON.stringify(stash));
  }
  // Verification: every written key holds exactly the intended value.
  const bad=Object.keys(res.items).filter(function(k2){const it=res.items[k2];return (it.action==='add'||it.action==='merge'||it.action==='fill-empty')&&localStorage.getItem(k2)!==it.value;});
  return {ok:bad.length===0,written:written,snapshotKey:snapshotKey,stashKey:stashKey,unverified:bad};
}

function lineChart(pts,unit){
  const u=unit||'kg';
  if(pts.length<2)return '<div class="note">Servono almeno due punti per il grafico.</div>';
  const ws=pts.map(function(x){return x.w;});
  const mn=Math.min.apply(null,ws)-0.5, mx=Math.max.apply(null,ws)+0.5, rg=(mx-mn)||1;
  const W=300,H=110;

    const py=H-((x.w-mn)/rg)*H;
    return px.toFixed(1)+','+py.toFixed(1);});
  const line=coords.join(' ');
  const area='0,'+H+' '+line+' '+W+','+H;
  let dots='';
  pts.forEach(function(x,i){
    const px=pts.length>1?(i/(pts.length-1))*W:0;
    const py=H-((x.w-mn)/rg)*H;
    dots+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3.5" fill="#fff" stroke="#c9557f" stroke-width="2"/>';
  });

    '<polygon points="'+area+'" fill="#fbe9f0"/>'+
    '<polyline points="'+line+'" fill="none" stroke="#c9557f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots+'</svg>'+
    '<div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);font-weight:700;margin-top:6px">'+
    '<span>'+pts[0].w+' '+u+' · '+pts[0].d.toLocaleDateString('it-IT',{day:'numeric',month:'short'})+'</span>'+
    '<span>'+pts[pts.length-1].w+' '+u+' · '+pts[pts.length-1].d.toLocaleDateString('it-IT',{day:'numeric',month:'short'})+'</span></div>';
}

function i18nProtectedNode(n){
  for(let el=n&&n.parentNode;el&&el.nodeType===1;el=el.parentNode){
    const tag=String(el.nodeName||'').toUpperCase();
    if(tag==='TEXTAREA'||tag==='INPUT'||tag==='SCRIPT'||tag==='STYLE')return true;
    if(el.hasAttribute&&el.hasAttribute('data-no-i18n'))return true;
  }
  return false;
}

// READ-ONLY: counts set/done/warm keys written with the legacy "Day N|" prefix. Nothing is changed.
function countLegacyDayKeys(){
  let n=0;
  for(let i=0;i<localStorage.length;i++){
    const k2=localStorage.key(i); if(!k2||!/^fede:\d{4}-\d{2}-\d{2}$/.test(k2))continue;
    let v=null; try{v=JSON.parse(localStorage.getItem(k2));}catch(e){continue;}
    if(!v||typeof v!=='object')continue;
    ['sets','done','warm'].forEach(function(f){Object.keys(v[f]||{}).forEach(function(x){if(/^Day\s*[1-5]\|/.test(x))n++;});});
  }
  return n;
}

/* ---------- Motion P0: screen-change flag (visual only; reads state, never writes data) ---------- */
// The same screen re-rendered (water, ticks, tabs, Coach messages...) must NOT replay the entry.
let __motionScreenKey=null, __motionEnterAt=0, __motionEnterTimer=null;
function motionScreenKey(){
  if(view==='exercise')return 'exercise|'+(data&&data.day)+'|'+exIdx;
  if(view==='workout')return 'workout|'+(data&&data.day);
  return String(view);
}
function applyScreenEnter(){
  const page=document.getElementById('page'); if(!page||!page.setAttribute)return;
  const key=motionScreenKey(), now=Date.now();
  if(__motionScreenKey===null){__motionScreenKey=key;return;} // first paint: no animation
  if(key!==__motionScreenKey){
    __motionScreenKey=key; __motionEnterAt=now;
    page.style.setProperty('--enter-delay','0ms');
    page.setAttribute('data-enter','');
    clearTimeout(__motionEnterTimer);
    __motionEnterTimer=setTimeout(function(){page.removeAttribute('data-enter');},400);
    return;
  }
  // Same screen: never restart. If an entry is still running, the new content continues it seamlessly.
  if(page.hasAttribute('data-enter'))page.style.setProperty('--enter-delay',(-(now-__motionEnterAt))+'ms');
}
function render(){
  try{renderCore();applyLanguage();try{applyScreenEnter();}catch(e){}}
  catch(err){
    console.error('Fede Training render error',err);
    const page=document.getElementById('page');

/* ---------- Rest timer (UI only; no data) ----------
   Countdown from an END TIMESTAMP, so it stays correct when iOS suspends the app. Kept across re-renders of the
   same exercise; reset only when a DIFFERENT exercise screen is shown. */
let restTimer={key:null,endAt:0,remaining:null,id:null};
function restFmt(sec){sec=Math.max(0,Math.round(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}
function restLeft(){return restTimer.endAt?Math.max(0,Math.ceil((restTimer.endAt-Date.now())/1000)):(restTimer.remaining==null?null:restTimer.remaining);}
function restPaint(){const el=document.getElementById('restTimer'),left=restLeft();if(el&&left!=null)el.textContent=restFmt(left);}
function restTick(){
  const left=restLeft(); restPaint();
  if(restTimer.endAt&&left===0){clearInterval(restTimer.id);restTimer.id=null;restTimer.endAt=0;restTimer.remaining=0;try{navigator.vibrate&&navigator.vibrate([150,80,150]);}catch(e){}}
}
function restTimerAttach(el,initial){
  const key=view==='exercise'?exDay()+'|'+exIdx:null;
  if(key&&restTimer.key!==key){if(restTimer.id)clearInterval(restTimer.id);restTimer={key:key,endAt:0,remaining:null,id:null};}
  if(el)restPaint();
}
function restTimerStart(initial){
  const left=restLeft(), base=(left==null||left===0)?initial:left;
  restTimer.remaining=null; restTimer.endAt=Date.now()+base*1000;
  if(!restTimer.id)restTimer.id=setInterval(restTick,250);
  restTick();
}
function restTimerAdd(sec,initial){
  if(restTimer.endAt)restTimer.endAt+=sec*1000; else restTimer.remaining=(restTimer.remaining==null?initial:restTimer.remaining)+sec;
  restPaint();
}
function restTimerReset(initial){
  if(restTimer.id)clearInterval(restTimer.id);
  restTimer.id=null; restTimer.endAt=0; restTimer.remaining=initial; restPaint();
}

  if(mcClose)mcClose.onclick=function(){miniCoachOpen=false;render();};
  document.querySelectorAll('[data-mini]').forEach(function(b){b.onclick=function(){miniCoachOpen=true;miniCoachSend(b.dataset.mini);};});
  document.querySelectorAll('[data-coach-action]').forEach(function(b){b.onclick=function(){miniCoachOpen=true; const a=b.dataset.coachAction; if(a==='coach-confirm'){miniCoachMessages.push({r:'user',text:'Sì, confermo'}); try{miniCoachMessages.push({r:'bot',text:coachApplyPending()});}catch(err){console.error(err);coachPending=null;miniCoachMessages.push({r:'bot',text:'Ho avuto un problema durante la modifica. Non ho cancellato lo storico. Apri Profilo → Diagnostica e riprova.'});} render(); return;} if(a==='coach-cancel'){coachPending=null;miniCoachMessages.push({r:'user',text:'No'});miniCoachMessages.push({r:'bot',text:'Va bene, non modifico nulla.'});render();return;} if(a.indexOf('reason:')===0){miniCoachSend(a.slice(7));}};});
  const mcs=document.getElementById('minicoachsend'), mci=document.getElementById('minicoachtext');
  if(mcs&&mci){mcs.onclick=function(){miniCoachSend(mci.value);};mci.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();miniCoachSend(mci.value);}};}

  // profilo
  const ps=document.getElementById('profileSave'); if(ps)ps.onclick=function(){if(profileSaveFromForm()){alert('Profilo salvato ✓');render();}else alert('Non riesco a salvare il profilo su questo dispositivo.');};
  const pp=document.getElementById('profilePlan'); if(pp)pp.onclick=profileApplyPlan;
  const rd=document.getElementById('runDiagnostics'); if(rd)rd.onclick=runDiagnostics;
  const pr=document.getElementById('profileResetOnboarding'); if(pr)pr.onclick=function(){if(!confirm('Vuoi reimpostare l’onboarding? Il workout storico non verrà cancellato.'))return;if(userPlan)writeUserPlanMeta({customized:true,source:'kept-on-onboarding-reset'});profile=Object.assign({},profile||DEFAULT_PROFILE,{setupComplete:false,personalised:false});coachStep=0;coachMessages=[];saveProfile();go('coach');};

  const li=document.getElementById('langIT'),le=document.getElementById('langEN'); if(li)li.onclick=function(){setAppLanguage('it');}; if(le)le.onclick=function(){setAppLanguage('en');}; // backup
  const cb=document.getElementById('copybtn'),ib=document.getElementById('impbtn'),ex=document.getElementById('exp'),db=document.getElementById('downloadbtn');
  // Copy/Download always use a fresh export built from storage (never the textarea text).
  if(cb)cb.onclick=function(){const txt=JSON.stringify(buildBackupObject(),null,2);
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){cb.textContent="✓ copiato";},function(){ex.value=txt;ex.select();try{document.execCommand('copy');cb.textContent="✓ copiato";}catch(e){cb.textContent="copia a mano";}});}
    else{ex.value=txt;ex.select();try{document.execCommand('copy');cb.textContent="✓ copiato";}catch(e){cb.textContent="copia a mano";}}};
  if(db)db.onclick=function(){try{const blob=new Blob([JSON.stringify(buildBackupObject(),null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='fede-training-backup.json';a.click();setTimeout(function(){URL.revokeObjectURL(u);},500);}catch(e){alert('Download non disponibile');}};
  // Import: analyse first (read-only) -> preview -> explicit confirmation -> snapshot -> merge.
  const impf=document.getElementById('impfile');
  if(impf)impf.onchange=function(){const f=impf.files&&impf.files[0];if(!f||!ex)return;const r=new FileReader();r.onload=function(){ex.value=String(r.result||'');};r.readAsText(f);};
  if(ib)ib.onclick=function(){
    const box=document.getElementById('imppreview'); importAnalysis=null;
    const parsed=parseBackupText(ex?ex.value:'');
    if(!parsed.ok){if(box)box.innerHTML='<div class="card"><div class="note" style="color:#c9557f">'+esc(parsed.error)+' Nessun dato modificato.</div></div>';return;}
    importAnalysis=analyzeBackup(parsed.backup);
    if(box){box.innerHTML=importPreviewHTML(importAnalysis);
      const ic=document.getElementById('impconfirm'),ix=document.getElementById('impcancel');
      if(ix)ix.onclick=function(){importAnalysis=null;box.innerHTML='<div class="card"><div class="note">Importazione annullata. Nessun dato modificato.</div></div>';};
      if(ic)ic.onclick=function(){
        if(!importAnalysis)return;
        const rp=document.getElementById('impreplaceplan');
        let out;try{out=applyBackupImport(importAnalysis,{replacePlan:!!(rp&&rp.checked)});}catch(e){out={ok:false,error:'Errore durante l’importazione: '+((e&&e.message)||e)+'. La copia di sicurezza è disponibile.'};}
        importAnalysis=null;
        if(!out.ok){box.innerHTML='<div class="card"><div class="note" style="color:#c9557f">'+esc(out.error||('Verifica non riuscita per: '+(out.unverified||[]).join(', ')))+'</div></div>';return;}
        load().then(function(){evoTab='backup';view='evo';render();const b2=document.getElementById('imppreview');if(b2)b2.innerHTML='<div class="card"><div class="note">✓ Backup importato ('+out.written+' elementi). Copia di sicurezza: '+esc(out.snapshotKey)+(out.stashKey?'. Valori in conflitto conservati in '+esc(out.stashKey):'')+'.</div></div>';});
      };}
  };
}

// Save safety: write pending changes whenever the page may be suspended, hidden or closed.
// Motion P0 (visual only): iOS applies :active press states only when a touchstart listener exists.
document.addEventListener('touchstart',function(){},{passive:true});
// Checkmark pop: runs AFTER the set's own [data-done] handler (which saves data) and only adds a CSS
// class when the set became ticked. It never reads or writes workout data.
document.addEventListener('click',function(ev){
  const b=ev&&ev.target&&ev.target.closest?ev.target.closest('[data-done]'):null;
  if(b&&/(^|\s)on(\s|$)/.test(b.className))b.classList.add('chk-pop');
});
window.addEventListener('pagehide',function(){flushSave();});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flushSave();});
window.addEventListener('beforeunload',function(){flushSave();});
// Visual only: the set-number badge of a bilateral row reflects the tick immediately (no re-render needed).
document.addEventListener('click',function(ev){
  const b=ev&&ev.target&&ev.target.closest?ev.target.closest('[data-done]'):null; if(!b||!b.closest)return;
  const row=b.closest('.exrow'), num=row&&row.querySelector?row.querySelector('.num'):null;
  if(num&&num.classList)num.classList.toggle('done',/(^|\s)on(\s|$)/.test(b.className));
});

// Safe update flow: a new Service Worker waits (no automatic reload). The user is told
// "Nuovo aggiornamento disponibile"; it is activated only after pending data was saved.
let swUpdateRequested=false, swReloading=false;
function showUpdateBanner(worker){
  if(!worker||document.getElementById('swupdate'))return;
  const bar=document.createElement('div');
  bar.id='swupdate'; bar.setAttribute('data-no-i18n','');
  bar.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:200;width:calc(100% - 24px);max-width:620px;box-sizing:border-box;background:#fff;border:1px solid #eceaf1;border-radius:14px;box-shadow:0 4px 18px -6px rgba(30,35,64,.24);padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800';
  bar.innerHTML='<span style="flex:1">Nuovo aggiornamento disponibile</span><button type="button" id="swupdatebtn" style="border:0;border-radius:10px;padding:8px 12px;font-weight:800;background:#285744;color:#fff;cursor:pointer">Aggiorna</button>';
  document.body.appendChild(bar);
  const b=document.getElementById('swupdatebtn'); if(b)b.onclick=function(){applyServiceWorkerUpdate(worker);};
}
// Activates the waiting worker ONLY if all pending data is safely written; otherwise postpones.
function applyServiceWorkerUpdate(worker){
  if(!flushSave()){
    const s=document.getElementById('status');
    if(s){s.style.color='#c9557f';s.textContent='⚠ Salvataggio non riuscito: aggiornamento rimandato';}
    return false;
  }
  swUpdateRequested=true;
  worker.postMessage({type:'SKIP_WAITING'});
  return true;
}
function onServiceWorkerControllerChange(){
  // Reload only for an update the user requested (never on first install or for other tabs).
  if(!swUpdateRequested||swReloading)return false;
  swReloading=true; flushSave(); window.location.reload(); return true;
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('controllerchange',onServiceWorkerControllerChange);
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(function(reg){
      if(reg.waiting&&navigator.serviceWorker.controller)showUpdateBanner(reg.waiting);
      reg.addEventListener('updatefound',function(){ const w=reg.installing; if(!w)return; w.addEventListener('statechange',function(){ if(w.state==='installed'&&navigator.serviceWorker.controller)showUpdateBanner(w); }); });
      reg.update().catch(function(){});
    }).catch(function(){});
  });
}
